openapi: 3.0.0
info:
  title: Max Bot API
  version: 0.0.32
  description: Бот-платформа мессенджера MAX. https://dev.max.ru/docs-api
tags:
  - name: bots
  - name: bot-sending
  - name: messages
  - name: subscriptions
  - name: upload
paths:
  /answers:
    post:
      operationId: answerOnCallback
      summary: Ответ на callback
      description: |-
        Отправка ответа после того, как пользователь нажал на кнопку. Ответом
        может быть обновлённое сообщение. Не более двух ответов в секунду в один
        диалог, групповой чат или канал
      parameters:
        - name: callback_id
          in: query
          required: true
          description: Идентификатор кнопки, на которую нажал пользователь
          schema:
            type: string
            pattern: ^(?!\s*$).+
            minLength: 1
          explode: false
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimpleQueryResult'
        '401':
          description: 'Ошибка авторизации: не предоставлен или недействителен access_token'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '405':
          description: Метод не разрешён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      tags:
        - messages
        - bot-sending
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CallbackAnswer'
  /me:
    get:
      operationId: getMyInfo
      summary: Получение информации о боте
      description: Возвращает информацию о боте, который идентифицируется с помощью токена доступа `access_token`
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BotInfo'
        '401':
          description: 'Ошибка авторизации: не предоставлен или недействителен access_token'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      tags:
        - bots
        - bot-sending
  /me/commands:
    patch:
      operationId: editMyCommands
      summary: Редактирование команд бота
      description: Добавляет, изменяет или удаляет команды бота. Для удаления команд передайте пустой массив `commands`
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BotCommandsInfo'
        '401':
          description: 'Ошибка авторизации: не предоставлен или недействителен access_token'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      tags:
        - bots
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BotCommandsPatch'
  /messages:
    get:
      operationId: getMessages
      summary: Получение сообщений
      description: |-
        Возвращает информацию о сообщении или массив сообщений из чата. Нужно
        указать один из параметров — `chat_id` или `message_ids`
      parameters:
        - name: chat_id
          in: query
          required: false
          description: ID чата, чтобы получить сообщения из определённого чата. Обязательный параметр, если не указан `message_ids`
          schema:
            type: integer
            format: int64
          explode: false
        - name: message_ids
          in: query
          required: false
          description: |-
            Список ID сообщений, которые нужно получить (через запятую).
            Обязательный параметр, если не указан `chat_id`.

            ОТЛИЧИЕ ОТ ОРИГИНАЛА (осознанное, см. DEVIATIONS в scripts/compare.py):
            в оригинальной схеме этот параметр описан как массив без объявленного
            items вообще — недосмотр (тот же приём копипасты, что и у UserIdsList).
            Мы транскрибируем содержательный смысл: массив строк.
          schema:
            type: array
            items:
              type: string
          explode: false
        - name: from
          in: query
          required: false
          description: Время, до которого будут запрошены все сообщения с начала чата (в формате Unix timestamp)
          schema:
            type: integer
            format: int64
          explode: false
        - name: to
          in: query
          required: false
          description: Время, начиная с которого будут запрошены все сообщения до конца чата (в формате Unix timestamp)
          schema:
            type: integer
            format: int64
          explode: false
        - name: count
          in: query
          required: false
          description: Максимальное количество сообщений в ответе
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
            default: 50
          explode: false
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageList'
        '401':
          description: 'Ошибка авторизации: не предоставлен или недействителен access_token'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: 'Ошибка доступа: нет прав на этот ресурс'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      tags:
        - messages
    post:
      operationId: sendMessage
      summary: Отправить сообщение
      description: |-
        Отправляет сообщение в диалог, групповой чат или канал. Можно отправлять
        не более двух сообщений в секунду в один диалог, групповой чат или канал —
        при превышении лимита ставьте сообщения в очередь или делайте задержку
      parameters:
        - name: user_id
          in: query
          required: false
          description: Если вы хотите отправить сообщение пользователю, укажите его ID
          schema:
            type: integer
            format: int64
          explode: false
        - name: chat_id
          in: query
          required: false
          description: Если сообщение отправляется в чат, укажите его ID
          schema:
            type: integer
            format: int64
          explode: false
        - name: disable_link_preview
          in: query
          required: false
          description: Если `true`, сервер не будет генерировать превью для ссылок в тексте сообщения
          schema:
            type: boolean
            default: false
          explode: false
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SendMessageResult'
        '401':
          description: 'Ошибка авторизации: не предоставлен или недействителен access_token'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      tags:
        - messages
        - bot-sending
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewMessageBody'
    put:
      operationId: editMessage
      summary: Редактировать сообщение
      description: |-
        Редактирует сообщения, отправленные ботом. В диалогах с ботом сообщения
        с кнопками `inline_keyboard` редактируются независимо от срока давности,
        остальные — если отправлены менее 7 суток назад; в групповых чатах и
        каналах — независимо от срока давности. Не более двух редактирований в
        секунду в одном диалоге, групповом чате или канале
      parameters:
        - name: message_id
          in: query
          required: true
          description: ID редактируемого сообщения
          schema:
            type: string
            minLength: 1
          explode: false
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimpleQueryResult'
        '401':
          description: 'Ошибка авторизации: не предоставлен или недействителен access_token'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      tags:
        - messages
        - bot-sending
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewMessageBody'
    delete:
      operationId: deleteMessage
      summary: Удалить сообщение
      description: |-
        Удаляет сообщения в диалоге, групповом чате или канале. Бот должен быть
        администратором и иметь право на удаление сообщений. В диалоге бот может
        удалять только собственные сообщения, в групповом чате и канале — любые.
        Не более двух удалений в секунду в одном диалоге, групповом чате или канале
      parameters:
        - name: message_id
          in: query
          required: true
          description: ID удаляемого сообщения
          schema:
            type: string
            minLength: 1
          explode: false
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimpleQueryResult'
        '401':
          description: 'Ошибка авторизации: не предоставлен или недействителен access_token'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: 'Ошибка доступа: нет прав на этот ресурс'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      tags:
        - messages
        - bot-sending
  /messages/{messageId}:
    get:
      operationId: getMessageById
      summary: Получить сообщение
      description: Возвращает сообщение по его ID
      parameters:
        - name: messageId
          in: path
          required: true
          description: ID сообщения (`mid`), чтобы получить одно сообщение в чате
          schema:
            type: string
            pattern: '[a-zA-Z0-9_\-]+'
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '401':
          description: 'Ошибка авторизации: не предоставлен или недействителен access_token'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Запрашиваемый ресурс не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      tags:
        - messages
  /subscriptions:
    get:
      operationId: getSubscriptions
      summary: Получение всех подписок через Webhook
      description: Если ваш бот получает данные через Webhook, этот метод возвращает список всех подписок
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetSubscriptionsResult'
        '401':
          description: 'Ошибка авторизации: не предоставлен или недействителен access_token'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      tags:
        - subscriptions
    post:
      operationId: subscribe
      summary: Подписка на обновления о новых событиях через Webhook
      description: Настраивает доставку событий бота через Webhook
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimpleQueryResult'
        '401':
          description: 'Ошибка авторизации: не предоставлен или недействителен access_token'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      tags:
        - subscriptions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubscriptionRequestBody'
    delete:
      operationId: unsubscribe
      summary: Отписка от обновлений о новых событиях через Webhook
      description: Отписывает бота от получения обновлений о новых событиях через Webhook
      parameters:
        - name: url
          in: query
          required: true
          description: URL, который нужно удалить из подписок на WebHook
          schema:
            type: string
          explode: false
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimpleQueryResult'
        '401':
          description: 'Ошибка авторизации: не предоставлен или недействителен access_token'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      tags:
        - subscriptions
  /updates:
    get:
      operationId: getUpdates
      summary: Получение обновлений о событиях через Long Polling
      description: Получение обновлений о событиях через Long Polling
      parameters:
        - name: limit
          in: query
          required: false
          description: Максимальное количество обновлений о событиях, которое может вернуться в ответе на запрос
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 100
          explode: false
        - name: timeout
          in: query
          required: false
          description: Тайм-аут в секундах для долгого опроса
          schema:
            type: integer
            minimum: 0
            maximum: 90
            default: 30
          explode: false
        - name: marker
          in: query
          required: false
          description: Чтобы получить последнее обновление событий, передайте `null` или оставьте поле пустым. Чтобы получить все обновления по событиям с момента предыдущего запроса, передайте значение `marker`, которое получили в ответ на предыдущий запрос
          schema:
            type: integer
            format: int64
            nullable: true
          explode: false
        - name: types
          in: query
          required: false
          description: 'Список типов событий, которые вы хотите получать, например: `message_created`, `message_callback`'
          schema:
            type: array
            items:
              type: string
            nullable: true
          explode: false
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateList'
        '401':
          description: 'Ошибка авторизации: не предоставлен или недействителен access_token'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '405':
          description: Метод не разрешён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      tags:
        - subscriptions
  /uploads:
    post:
      operationId: getUploadUrl
      summary: Загрузка медиафайлов
      description: |-
        Метод возвращает URL для загрузки медиафайла и токен для передачи
        загруженного файла во вложении к сообщению в чате или канале
      parameters:
        - name: type
          in: query
          required: true
          description: 'Тип загружаемого файла. Возможные значения: `"image"`, `"video"`, `"audio"`, `"file"`'
          schema:
            $ref: '#/components/schemas/UploadType'
          explode: false
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadEndpoint'
        '401':
          description: 'Ошибка авторизации: не предоставлен или недействителен access_token'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      tags:
        - upload
        - bot-sending
  /videos/{videoToken}:
    get:
      operationId: getVideoAttachmentDetails
      summary: Получить информацию о видео
      description: Возвращает подробную информацию о прикреплённом видео, URL-адреса воспроизведения и дополнительные метаданные
      parameters:
        - name: videoToken
          in: path
          required: true
          description: Токен видео-вложения
          schema:
            type: string
            pattern: '[a-zA-Z0-9_\-]+'
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideoAttachmentDetails'
        '401':
          description: 'Ошибка авторизации: не предоставлен или недействителен access_token'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: 'Ошибка доступа: нет прав на этот ресурс'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Запрашиваемый ресурс не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      tags:
        - messages
security:
  - ApiKeyAuth: []
  - BearerAuth: []
components:
  schemas:
    ActionRequestBody:
      type: object
      required:
        - action
      properties:
        action:
          allOf:
            - $ref: '#/components/schemas/SenderAction'
          description: Действие, отправляемое участникам чата
      description: Тело запроса на отправку действия отправителя (индикатор набора текста и т. п.)
    Attachment:
      type: object
      required:
        - type
      properties:
        type:
          type: string
          description: Тип вложения
      discriminator:
        propertyName: type
        mapping:
          image: '#/components/schemas/PhotoAttachment'
          video: '#/components/schemas/VideoAttachment'
          audio: '#/components/schemas/AudioAttachment'
          file: '#/components/schemas/FileAttachment'
          sticker: '#/components/schemas/StickerAttachment'
          contact: '#/components/schemas/ContactAttachment'
          inline_keyboard: '#/components/schemas/InlineKeyboardAttachment'
          share: '#/components/schemas/ShareAttachment'
          location: '#/components/schemas/LocationAttachment'
          data: '#/components/schemas/DataAttachment'
          reply_keyboard: '#/components/schemas/ReplyKeyboardAttachment'
      description: Общая схема, представляющая вложение сообщения
    AttachmentPayload:
      type: object
      required:
        - url
      properties:
        url:
          type: string
          description: |-
            URL медиа-вложения. Этот URL будет получен в объекте Update после
            отправки сообщения в чат.

            Прямую ссылку на видео также можно получить с помощью метода
            `GET /videos/{-videoToken-}`
      description: Базовая полезная нагрузка медиа-вложения
    AttachmentRequest:
      type: object
      required:
        - type
      properties:
        type:
          type: string
          description: Тип вложения
      discriminator:
        propertyName: type
        mapping:
          image: '#/components/schemas/PhotoAttachmentRequest'
          video: '#/components/schemas/VideoAttachmentRequest'
          audio: '#/components/schemas/AudioAttachmentRequest'
          file: '#/components/schemas/FileAttachmentRequest'
          sticker: '#/components/schemas/StickerAttachmentRequest'
          contact: '#/components/schemas/ContactAttachmentRequest'
          inline_keyboard: '#/components/schemas/InlineKeyboardAttachmentRequest'
          reply_keyboard: '#/components/schemas/ReplyKeyboardAttachmentRequest'
          location: '#/components/schemas/LocationAttachmentRequest'
          share: '#/components/schemas/ShareAttachmentRequest'
      description: Запрос на прикрепление данных к сообщению
    AudioAttachment:
      type: object
      required:
        - type
        - payload
      properties:
        type:
          type: string
          enum:
            - audio
        payload:
          allOf:
            - $ref: '#/components/schemas/MediaAttachmentPayload'
          description: Полезная нагрузка аудио-вложения
        transcription:
          type: string
          nullable: true
          description: Аудио транскрипция
      allOf:
        - $ref: '#/components/schemas/Attachment'
      description: Вложение аудио
    AudioAttachmentRequest:
      type: object
      required:
        - type
        - payload
      properties:
        type:
          type: string
          enum:
            - audio
        payload:
          allOf:
            - $ref: '#/components/schemas/UploadedInfo'
          description: Полезная нагрузка запроса на прикрепление аудио
      allOf:
        - $ref: '#/components/schemas/AttachmentRequest'
      description: Запрос на прикрепление аудио к сообщению. Должен быть единственным вложением в сообщении
    BotAddedToChatUpdate:
      type: object
      required:
        - update_type
        - chat_id
        - user
