          type: integer
          format: int32
          minimum: 0
          maximum: 2147483647
          description: Индекс начала элемента разметки в тексте. Нумерация с нуля
        length:
          type: integer
          format: int32
          minimum: 0
          maximum: 2147483647
          description: Длина элемента разметки
      additionalProperties: false
      description: Представляет `моноширинный` или блок ```код``` в тексте
    NewMessageBody:
      type: object
      required:
        - text
        - attachments
        - link
      properties:
        text:
          type: string
          nullable: true
          maxLength: 4000
          pattern: ^[\w\W]{0,4000}$
          description: Новый текст сообщения. 4000 — значение из официальной схемы MAX
        attachments:
          type: array
          items:
            $ref: '#/components/schemas/AttachmentRequest'
          nullable: true
          maxItems: 100
          description: Вложения сообщения. Если поле равно `null`, изменений не произойдет. Если пусто, все вложения будут удалены
        link:
          type: object
          allOf:
            - $ref: '#/components/schemas/NewMessageLink'
          nullable: true
          description: Ссылка на сообщение
        notify:
          type: boolean
          description: Если false, участники чата не будут уведомлены (по умолчанию `true`)
          default: true
        format:
          allOf:
            - $ref: '#/components/schemas/TextFormat'
          nullable: true
          description: Если установлен, текст сообщения будет форматирован данным способом. Для подробной информации загляните в раздел [Форматирование](/docs-api#Форматирование%20текста%20в%20сообщениях)
      additionalProperties: false
      description: Новое сообщение, отправляемое ботом
    NewMessageLink:
      type: object
      required:
        - type
        - mid
      properties:
        type:
          allOf:
            - $ref: '#/components/schemas/MessageLinkType'
          description: Тип ссылки сообщения
        mid:
          allOf:
            - $ref: '#/components/schemas/MessageId'
          description: ID исходного сообщения
      additionalProperties: false
      description: Ссылка на сообщение, которое нужно переслать или на которое нужно ответить
    OpenAppButton:
      type: object
      required:
        - type
        - text
      properties:
        type:
          type: string
          enum:
            - open_app
          description: 'Тип кнопки: `open_app`'
        web_app:
          type: string
          maxLength: 2048
          pattern: ^[\w\W]{0,2048}$
          description: Публичное имя (username) бота или ссылка на него, чьё мини-приложение надо запустить. 2048 — официальный лимит URL в оригинальной схеме (LinkButton.url, LinkMarkup.url)
        contact_id:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
          description: Идентификатор бота, чьё мини-приложение надо запустить
        payload:
          type: string
          maxLength: 1024
          pattern: ^[\w\W]{0,1024}$
          description: Параметр запуска, который будет передан в initData мини-приложения. 1024 — в оригинале лимита нет; по аналогии с официальным лимитом кнопочного payload (CallbackButton.payload)
        text:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[\w\W]{1,128}$
          description: 'Видимый текст кнопки. Чтобы он отображался полностью, рекомендуем не превышать заданное количество символов в зависимости от размещения текста: `20` символов — при 1 кнопке в ряду, `10` — при 2, `5` — при 3, `3` — при 4. 128 — значение из официальной схемы MAX'
      additionalProperties: false
      description: Кнопка для запуска мини-приложения
    PhotoAttachment:
      type: object
      required:
