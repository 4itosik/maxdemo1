          enum:
            - share
          description: 'Тип вложения: `share`'
        payload:
          allOf:
            - $ref: '#/components/schemas/ShareAttachmentPayload'
          description: Полезная нагрузка предпросмотра ссылки
        title:
          type: string
          nullable: true
          maxLength: 255
          pattern: ^[\w\W]{0,255}$
          description: Заголовок предпросмотра ссылки
        description:
          type: string
          nullable: true
          maxLength: 255
          pattern: ^[\w\W]{0,255}$
          description: Описание предпросмотра ссылки
        image_url:
          type: string
          nullable: true
          maxLength: 2048
          pattern: ^[\w\W]{0,2048}$
          description: Изображение предпросмотра ссылки. 2048 — официальный лимит URL в оригинальной схеме (LinkButton.url, LinkMarkup.url)
      additionalProperties: false
      description: Вложение с предпросмотром ссылки
    ShareAttachmentPayload:
      type: object
      properties:
        url:
          type: string
          nullable: true
          minLength: 1
          maxLength: 2048
          pattern: ^[\w\W]{1,2048}$
          description: URL, прикрепленный к сообщению в качестве предпросмотра медиа. 2048 — официальный лимит URL в оригинальной схеме (LinkButton.url, LinkMarkup.url)
        token:
          type: string
          nullable: true
          maxLength: 1024
          pattern: ^[\w\W]{0,1024}$
          description: Токен вложения. 1024 — в оригинале лимита нет; по аналогии с официальным лимитом кнопочного payload (CallbackButton.payload)
      additionalProperties: false
      description: Полезная нагрузка запроса ShareAttachmentRequest
    ShareAttachmentRequest:
      type: object
