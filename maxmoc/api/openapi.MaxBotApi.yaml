      properties:
        message:
          allOf:
            - $ref: '#/components/schemas/Message'
          description: Отправленное сообщение
      description: Результат отправки сообщения
    SenderAction:
      type: string
      enum:
        - typing_on
        - sending_photo
        - sending_video
        - sending_audio
        - sending_file
      description: |-
        Действие, отправляемое участникам чата. Возможные значения:
        - `"typing_on"` — Бот набирает сообщение
        - `"sending_photo"` — Бот отправляет фото
        - `"sending_video"` — Бот отправляет видео
        - `"sending_audio"` — Бот отправляет аудиофайл
        - `"sending_file"` — Бот отправляет файл
    ShareAttachment:
      type: object
      required:
        - type
        - payload
      properties:
        type:
          type: string
          enum:
            - share
        payload:
          allOf:
            - $ref: '#/components/schemas/ShareAttachmentPayload'
          description: Полезная нагрузка предпросмотра ссылки
        title:
          type: string
          nullable: true
          description: Заголовок предпросмотра ссылки
        description:
          type: string
          nullable: true
          description: Описание предпросмотра ссылки
        image_url:
          type: string
          nullable: true
          description: Изображение предпросмотра ссылки
      allOf:
        - $ref: '#/components/schemas/Attachment'
      description: Вложение с предпросмотром ссылки
    ShareAttachmentPayload:
      type: object
      properties:
        url:
