        token:
          type: string
          nullable: true
          maxLength: 1024
          pattern: ^[\w\W]{0,1024}$
          description: Токен существующего вложения. 1024 — в оригинале лимита нет; по аналогии с официальным лимитом кнопочного payload (CallbackButton.payload)
        photos:
