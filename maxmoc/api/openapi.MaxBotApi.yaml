        text:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[\w\W]{1,128}$
          description: Видимый текст кнопки. 128 — значение из официальной схемы MAX
        payload:
          type: string
          nullable: true
          maxLength: 1024
