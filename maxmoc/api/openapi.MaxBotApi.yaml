          maxLength: 128
          pattern: ^[\w\W]{1,128}$
          description: Видимый текст кнопки. 128 — значение из официальной схемы MAX
        payload:
          type: string
          nullable: true
          maxLength: 1024
          pattern: ^[\w\W]{0,1024}$
          description: Токен кнопки. 1024 — значение из официальной схемы MAX
      additionalProperties: false
      description: После нажатия на такую кнопку клиент отправляет новое сообщение с вложением текущего географического положения пользователя
    SendMessageButton:
