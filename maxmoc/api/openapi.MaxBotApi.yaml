        photo_id:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
          description: Уникальный ID этого изображения
        token:
          type: string
          maxLength: 1024
          pattern: ^[\w\W]{0,1024}$
          description: Токен вложения. 1024 — в оригинале лимита нет; по аналогии с официальным лимитом кнопочного payload (CallbackButton.payload)
        url:
          type: string
          maxLength: 2048
