      description: Информация о командах бота
    BotCommandsPatch:
      type: object
      properties:
        commands:
          type: array
          items:
            $ref: '#/components/schemas/BotCommand'
          maxItems: 32
          description: Команды, которые поддерживает бот
      description: Объект PATCH для обновления команд бота
    BotInfo:
      type: object
      properties:
        commands:
          type: array
          items:
            $ref: '#/components/schemas/BotCommand'
          nullable: true
          maxItems: 32
          description: Команды, поддерживаемые ботом
      allOf:
        - $ref: '#/components/schemas/UserWithPhoto'
      description: Объект включает общую информацию о боте, URL аватара и описание. Является наследником схемы UserWithPhoto. Дополнительно к ней содержит список команд, поддерживаемых ботом. Возвращается только при вызове метода `GET /me`
    BotPatch:
      type: object
      properties:
        first_name:
          type: string
          nullable: true
          minLength: 1
          maxLength: 64
          description: Отображаемое имя пользователя или название бота
        last_name:
          type: string
          nullable: true
          minLength: 1
          maxLength: 64
          description: Отображаемое второе имя бота
        name:
          type: string
          nullable: true
          description: Поле устарело, скоро будет удалено. Используйте `first_name`
          deprecated: true
        description:
          type: string
          nullable: true
          minLength: 1
          maxLength: 16000
          description: Описание бота
        commands:
          type: array
          items:
            $ref: '#/components/schemas/BotCommand'
          nullable: true
          maxItems: 32
          description: Команды, поддерживаемые ботом. Чтобы удалить все команды, передайте пустой список
        photo:
          type: object
          allOf:
            - $ref: '#/components/schemas/PhotoAttachmentRequestPayload'
          nullable: true
          description: Запрос на установку фото бота
      description: Параметры изменения свойств бота
    BotRemovedFromChatUpdate:
      type: object
      required:
        - update_type
        - chat_id
        - user
        - is_channel
      properties:
        update_type:
          type: string
          enum:
            - bot_removed
        chat_id:
          type: integer
          format: int64
          description: ID чата, откуда был удалён бот. Как получить ID — в разделе «Получение chat_id»
        user:
          allOf:
            - $ref: '#/components/schemas/User'
          description: Пользователь, удаливший бота из чата
        is_channel:
          type: boolean
          description: Указывает, что бот удалён из канала, а не из чата
      allOf:
        - $ref: '#/components/schemas/Update'
      description: Вы получите это событие, как только бот будет удалён из чата
    BotStartedUpdate:
      type: object
      required:
        - update_type
        - chat_id
        - user
      properties:
        update_type:
          type: string
          enum:
            - bot_started
        chat_id:
          type: integer
          format: int64
          description: ID диалога, где произошло событие. Как получить ID — в разделе «Получение chat_id»
        user:
          allOf:
            - $ref: '#/components/schemas/User'
          description: Пользователь, который нажал кнопку `Start`
        payload:
          type: string
          nullable: true
          maxLength: 512
          description: Дополнительные данные из диплинков, переданные при запуске бота
        user_locale:
          type: string
          description: Текущий язык пользователя в формате IETF BCP 47
      allOf:
        - $ref: '#/components/schemas/Update'
      description: |-
        Вы получите это событие, как только пользователь начнёт или возобновит
        общение с ботом: нажмёт соответствующую кнопку в настройках бота в МАКС
    BotStoppedUpdate:
      type: object
      required:
        - update_type
        - chat_id
        - user
      properties:
        update_type:
          type: string
          enum:
            - bot_stopped
        chat_id:
          type: integer
          format: int64
          description: ID диалога, где произошло событие. Как получить ID — в разделе «Получение chat_id»
        user:
          allOf:
            - $ref: '#/components/schemas/User'
          description: Пользователь, который остановил бота
        user_locale:
          type: string
          description: Текущий язык пользователя в формате IETF BCP 47
      allOf:
        - $ref: '#/components/schemas/Update'
      description: Вы получите это событие, как только пользователь остановит бота в его настройках в МАКС
    Button:
      type: object
      required:
        - text
        - type
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 128
          description: 'Видимый текст кнопки. Чтобы он отображался полностью, рекомендуем не превышать заданное количество символов в зависимости от размещения текста: `20` символов — при 1 кнопке в ряду, `10` — при 2, `5` — при 3, `3` — при 4'
        type:
          type: string
          description: Discriminator property for Button.
      discriminator:
        propertyName: type
        mapping:
          callback: '#/components/schemas/CallbackButton'
          link: '#/components/schemas/LinkButton'
          request_geo_location: '#/components/schemas/RequestGeoLocationButton'
          request_contact: '#/components/schemas/RequestContactButton'
          chat: '#/components/schemas/ChatButton'
          open_app: '#/components/schemas/OpenAppButton'
          clipboard: '#/components/schemas/ClipboardButton'
          message: '#/components/schemas/MessageButton'
      description: Кнопка клавиатуры
    Callback:
      type: object
      required:
        - timestamp
        - callback_id
        - user
      properties:
        timestamp:
          type: integer
          format: int64
          description: Unix-время, когда пользователь нажал кнопку
        callback_id:
          type: string
          description: Текущий ID клавиатуры
        payload:
          type: string
          description: Токен кнопки
        user:
          allOf:
            - $ref: '#/components/schemas/User'
          description: Пользователь, нажавший на кнопку
      description: Объект, отправленный боту, когда пользователь нажимает кнопку
    CallbackAnswer:
      type: object
      properties:
        message:
          type: object
          allOf:
            - $ref: '#/components/schemas/NewMessageBody'
          nullable: true
          description: Заполните это, если хотите изменить текущее сообщение
      description: Отправьте этот объект, когда ваш бот хочет отреагировать на нажатие кнопки
    CallbackButton:
      type: object
      required:
        - type
        - payload
      properties:
        type:
          type: string
          enum:
            - callback
        payload:
          type: string
          maxLength: 1024
          description: Токен кнопки
      allOf:
        - $ref: '#/components/schemas/Button'
      description: После нажатия на такую кнопку клиент отправляет на сервер полезную нагрузку
    Chat:
      type: object
      required:
        - chat_id
        - type
        - status
        - title
        - icon
        - last_event_time
        - participants_count
        - is_public
        - description
      properties:
        chat_id:
          type: integer
          format: int64
          description: ID чата или канала — в зависимости от ограничений метода и от того, с чем вы работаете. Как получить ID — в разделе «Получение chat_id»
        type:
          allOf:
            - $ref: '#/components/schemas/ChatType'
          description: 'Тип чата: `"chat"` — Групповой чат, `"channel"` — Канал, `"dialog"` — Диалог'
        status:
          allOf:
            - $ref: '#/components/schemas/ChatStatus'
          description: 'Статус чата: `"active"` — Бот является активным участником чата, `"removed"` — Бот был удалён из чата, `"left"` — Бот покинул чат, `"closed"` — Чат был закрыт'
        title:
          type: string
          nullable: true
          description: Отображаемое название чата или канала. Может быть `null` для диалогов
        icon:
          type: object
          allOf:
            - $ref: '#/components/schemas/Image'
          nullable: true
          description: Иконка чата или канала
        last_event_time:
          type: integer
          format: int64
          description: Время последнего события в чате или канале
        participants_count:
          type: integer
          format: int32
          description: Количество участников чата или канала. Для диалогов всегда `2`
        owner_id:
          type: integer
          format: int64
          nullable: true
          description: ID владельца чата или канала
        participants:
          type: object
          additionalProperties:
            type: integer
            format: int64
          nullable: true
          description: Участники чата или канала с временем последней активности. Может быть `null`, если запрашивается список чатов
        is_public:
          type: boolean
          description: Доступен ли чат публично (для диалогов всегда `false`)
        link:
          type: string
          nullable: true
          description: Ссылка на чат
        description:
          type: string
          nullable: true
          description: Описание чата или канала
        dialog_with_user:
          type: object
          allOf:
            - $ref: '#/components/schemas/UserWithPhoto'
          nullable: true
          description: Данные о пользователе в диалоге (только для чатов типа `"dialog"`)
        messages_count:
          type: integer
          nullable: true
          description: Количество сообщений в групповых чатах и каналах
        pinned_message:
          type: object
          allOf:
            - $ref: '#/components/schemas/Message'
          nullable: true
          description: Закреплённое сообщение в чате (возвращается только при запросе конкретного чата или канала)
      description: |-
        Объект содержит общую информацию о групповом чате или канале: его тип,
        настройки отображения (название, аватар, описание, ссылка), публичную
        доступность, а также информацию об участниках (владельце, боте и других
        пользователях), времени их последней активности и событиях
    ChatAdmin:
      type: object
      required:
        - user_id
        - permissions
      properties:
        user_id:
          type: integer
          format: int64
          description: Идентификатор пользователя-участника группового чата или канала, который назначается администратором. Максимум — 50 администраторов в чате
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/ChatAdminPermission'
          description: |-
            Перечень прав доступа пользователя или бота, который назначается
            администратором группового чата или канала. Если право назначается
            действующему администратору, то его текущие права будут обновлены в
            соответствии с переданным списком
        alias:
          type: string
          description: |-
            Описание роли, которое будет отображаться на клиентском устройстве в
            настройках чата или канала рядом с именем пользователя
      description: Назначить администратора группового чата или канала
    ChatAdminPermission:
      type: string
      enum:
        - read_all_messages
        - add_remove_members
        - add_admins
        - change_chat_info
        - pin_message
        - write
        - can_call
        - edit_link
        - post_edit_delete_message
        - edit_message
        - delete_message
        - edit
        - delete
      description: Права администратора группового чата или канала
    ChatAdminsList:
      type: object
      required:
        - admins
      properties:
        admins:
          type: array
          items:
            $ref: '#/components/schemas/ChatAdmin'
          description: Список пользователей и ботов, которые получат права администратора группового чата или канала
        marker:
          type: integer
          format: int64
          nullable: true
          description: Указатель на следующую страницу данных
      description: Пагинированный список администраторов группового чата или канала
    ChatButton:
      type: object
      required:
        - type
        - chat_title
      properties:
        type:
          type: string
          enum:
            - chat
        chat_title:
          type: string
          maxLength: 200
          description: Название чата, который будет создан
        chat_description:
          type: string
          nullable: true
          maxLength: 400
          description: Описание чата
        start_payload:
          type: string
          nullable: true
          maxLength: 512
          description: Стартовая полезная нагрузка будет отправлена боту, как только чат будет создан
        uuid:
          type: integer
          nullable: true
          description: |-
            Уникальный ID кнопки среди всех кнопок чата на клавиатуре.
            Если `uuid` изменён, новый чат будет создан при следующем нажатии.
            Сервер сгенерирует его в момент, когда кнопка будет впервые размещена.
            Используйте его при редактировании сообщения.
      allOf:
        - $ref: '#/components/schemas/Button'
      description: |-
        Кнопка, которая создает новый чат, как только первый пользователь на нее нажмёт.
        Бот будет добавлен в участники чата как администратор.
        Автор сообщения станет владельцем чата.

        В оригинальной схеме отсутствует в `Button.discriminator.mapping` — см.
        DEVIATIONS `mapping[chat]` в scripts/compare.py: литерал "chat" выведен по
        конвенции соседних ключей (тот же приём, что и для `DataAttachment`).
    ChatList:
      type: object
      required:
        - chats
        - marker
      properties:
        chats:
          type: array
          items:
            $ref: '#/components/schemas/Chat'
          description: Список запрашиваемых чатов
        marker:
          type: integer
          format: int64
          nullable: true
          description: Указатель на следующую страницу запрашиваемых чатов
      description: Пагинированный список чатов
    ChatMember:
      type: object
      required:
        - last_access_time
        - is_owner
        - is_admin
        - join_time
        - permissions
      properties:
        last_access_time:
          type: integer
          format: int64
          description: Время последней активности пользователя в чате. Может быть устаревшим для суперчатов (равно времени вступления)
        is_owner:
          type: boolean
          description: Является ли пользователь владельцем группового чата или канала
        is_admin:
          type: boolean
          description: Является ли пользователь администратором группового чата или канала
        join_time:
          type: integer
          format: int64
          description: Дата присоединения к чату в формате Unix time
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/ChatAdminPermission'
          nullable: true
          description: |-
            Перечень прав доступа пользователя или бота, если тот является
            администратором группового чата или канала. Для обычных участников чата
            или канала поле не возвращается
        alias:
          type: string
          description: |-
            Описание роли, которое будет отображаться на клиентском устройстве в
            настройках чата или канала рядом с именем пользователя
      allOf:
        - $ref: '#/components/schemas/UserWithPhoto'
      description: |-
        Объект включает общую информацию о пользователе или боте, URL аватара и
        описание (при наличии). Является наследником схемы UserWithPhoto.
        Дополнительно к ней содержит данные для пользователей-участников чата или
        канала. Возвращается только при вызове некоторых методов группы `/chats`
    ChatMembersList:
      type: object
      required:
        - members
      properties:
        members:
          type: array
          items:
            $ref: '#/components/schemas/ChatMember'
          description: |-
            Список участников группового чата или канала с общей информацией о них,
            а также временем последней активности и списком прав доступа для
            пользователей и ботов, которые являются администраторами
        marker:
          type: integer
          format: int64
          nullable: true
          description: Указатель на следующую страницу данных
      description: Пагинированный список участников группового чата или канала
    ChatPatch:
      type: object
      properties:
        icon:
          type: object
          allOf:
            - $ref: '#/components/schemas/PhotoAttachmentRequestPayload'
          nullable: true
          description: Запрос на изменение иконки чата или канала
        title:
          type: string
          nullable: true
          minLength: 1
          maxLength: 200
          description: Отображаемое название чата или канала
        pin:
          type: string
          nullable: true
          description: ID сообщения для закрепления в чате. Чтобы удалить закреплённое сообщение, используйте метод unpin
        notify:
          type: boolean
          nullable: true
          description: Если `true`, участники получат системное уведомление об изменении
          default: true
      description: Параметры изменения свойств чата или канала
    ChatStatus:
      type: string
      enum:
        - active
        - removed
        - left
        - closed
      description: Статус чата для текущего бота
    ChatTitleChangedUpdate:
      type: object
      required:
        - update_type
        - chat_id
        - user
        - title
      properties:
        update_type:
          type: string
          enum:
            - chat_title_changed
        chat_id:
          type: integer
          format: int64
          description: ID чата, где произошло событие. Как получить ID — в разделе «Получение chat_id»
        user:
          allOf:
            - $ref: '#/components/schemas/User'
          description: Пользователь, который изменил название
        title:
          type: string
          description: Новое название
      allOf:
        - $ref: '#/components/schemas/Update'
      description: Вы получите это событие, как только будет изменено название чата
    ChatType:
      type: string
      enum:
        - chat
      description: 'Тип чата: диалог, чат'
    ClipboardButton:
      type: object
      required:
        - type
        - payload
      properties:
        type:
          type: string
          enum:
            - clipboard
        payload:
          type: string
          maxLength: 1024
          description: Текст, который будет скопирован
      allOf:
        - $ref: '#/components/schemas/Button'
      description: При нажатии на кнопку с типом `clipboard` текст, указанный в свойстве `payload`, копируется в буфер обмена
    ContactAttachment:
      type: object
      required:
        - type
        - payload
      properties:
        type:
          type: string
          enum:
            - contact
        payload:
          allOf:
            - $ref: '#/components/schemas/ContactAttachmentPayload'
          description: Полезная нагрузка вложения-контакта
      allOf:
        - $ref: '#/components/schemas/Attachment'
      description: Вложение с карточкой контакта
    ContactAttachmentPayload:
      type: object
      properties:
        vcf_info:
          type: string
          nullable: true
          description: Информация о пользователе в формате VCF
        hash:
          type: string
          nullable: true
          description: |-
            Хеш информации о пользователе в формате VCF. Используется для проверки
            того, что пользователь поделился номером телефона, привязанным к его
            аккаунту в МАКС. Подробнее — в разделе «Типы кнопок»
        max_info:
          type: object
          allOf:
            - $ref: '#/components/schemas/User'
          nullable: true
          description: Информация о пользователе
      description: Полезная нагрузка вложения-контакта
    ContactAttachmentRequest:
      type: object
      required:
        - type
        - payload
      properties:
        type:
          type: string
          enum:
            - contact
        payload:
          allOf:
            - $ref: '#/components/schemas/ContactAttachmentRequestPayload'
          description: Полезная нагрузка запроса на прикрепление карточки контакта
      allOf:
        - $ref: '#/components/schemas/AttachmentRequest'
      description: Запрос на прикрепление карточки контакта к сообщению. Должен быть единственным вложением в сообщении
    ContactAttachmentRequestPayload:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          nullable: true
          description: Имя контакта
        contact_id:
          type: integer
          format: int64
          nullable: true
          description: ID контакта, если он зарегистрирован в MAX
        vcf_info:
          type: string
          nullable: true
