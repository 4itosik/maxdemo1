            - message_removed
          description: 'Тип события: `message_removed`'
        message_id:
          allOf:
            - $ref: '#/components/schemas/MessageId'
          description: ID удалённого сообщения
        chat_id:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
          description: ID чата, где сообщение было удалено. Как получить ID — в разделе «Получение chat_id»
        user_id:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
          description: Пользователь, удаливший сообщение
        timestamp:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
          description: Unix-время, когда произошло событие
      additionalProperties: false
      description: Вы получите это событие, как только сообщение будет удалено
    MessageStat:
      type: object
      required:
        - views
      properties:
        views:
          type: integer
          minimum: 0
          maximum: 2147483647
          description: Количество пользователей, которые увидели пост в канале. Просмотр засчитывается, когда пост попадает в область видимости экрана
      additionalProperties: false
      description: Статистика сообщения. Возвращается только для постов в каналах
    MonospacedMarkup:
      type: object
      required:
        - type
        - from
        - length
