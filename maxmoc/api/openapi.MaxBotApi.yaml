          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[\w\W]{1,128}$
          description: 'Видимый текст кнопки. Чтобы он отображался полностью, рекомендуем не превышать заданное количество символов в зависимости от размещения текста: `20` символов — при 1 кнопке в ряду, `10` — при 2, `5` — при 3, `3` — при 4. 128 — значение из официальной схемы MAX'
      additionalProperties: false
      description: После нажатия на такую кнопку клиент отправляет новое сообщение с вложением текущего контакта пользователя
    RequestGeoLocationButton:
      type: object
      required:
