openapi: 3.0.0
info:
  title: Max Bot API
  version: 0.0.33
  contact:
    name: Max Bot API (placeholder)
    url: https://dev.max.ru/docs-api
    email: bot-api-placeholder@example.com
  description: Бот-платформа мессенджера MAX. https://dev.max.ru/docs-api
tags:
  - name: bots
  - name: bot-sending
  - name: messages
  - name: subscriptions
  - name: upload
paths:
  /answers:
    post:
      operationId: answerOnCallback
      summary: Ответ на callback
      description: |-
        Отправка ответа после того, как пользователь нажал на кнопку. Ответом
        может быть обновлённое сообщение. Не более двух ответов в секунду в один
        диалог, групповой чат или канал
      parameters:
        - name: callback_id
          in: query
          required: true
          description: |-
            Идентификатор кнопки, на которую нажал пользователь. 1024 — в оригинале
            лимита нет; по аналогии с официальным лимитом кнопочного payload
            (CallbackButton.payload).

            Паттерн оригинала `^(?!\s*$).+` использует lookahead (не поддерживается
            RE2-движками, в т.ч. СОВА) и пропускает любое непустое значение —
            заменён на «любые непробельные символы».
          schema:
            type: string
            pattern: ^\S{1,1024}$
            minLength: 1
            maxLength: 1024
          explode: false
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimpleQueryResult'
        '401':
          description: 'Ошибка авторизации: не предоставлен или недействителен access_token'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '405':
          description: Метод не разрешён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      tags:
        - messages
        - bot-sending
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CallbackAnswer'
  /me:
    get:
      operationId: getMyInfo
      summary: Получение информации о боте
      description: Возвращает информацию о боте, который идентифицируется с помощью токена доступа `access_token`
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BotInfo'
        '401':
          description: 'Ошибка авторизации: не предоставлен или недействителен access_token'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      tags:
        - bots
        - bot-sending
  /me/commands:
    patch:
      operationId: editMyCommands
      summary: Редактирование команд бота
      description: Добавляет, изменяет или удаляет команды бота. Для удаления команд передайте пустой массив `commands`
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BotCommandsInfo'
        '401':
          description: 'Ошибка авторизации: не предоставлен или недействителен access_token'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      tags:
        - bots
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BotCommandsPatch'
  /messages:
    get:
      operationId: getMessages
      summary: Получение сообщений
      description: |-
        Возвращает информацию о сообщении или массив сообщений из чата. Нужно
        указать один из параметров — `chat_id` или `message_ids`
      parameters:
        - name: chat_id
          in: query
          required: false
          description: ID чата, чтобы получить сообщения из определённого чата. Обязательный параметр, если не указан `message_ids`
          schema:
            type: integer
            format: int64
            minimum: 0
            maximum: 9007199254740991
          explode: false
        - name: message_ids
          in: query
          required: false
          description: |-
            Список ID сообщений, которые нужно получить (через запятую).
            Обязательный параметр, если не указан `chat_id`.

            ОТЛИЧИЕ ОТ ОРИГИНАЛА (осознанное, см. DEVIATIONS в scripts/compare.py):
            в оригинальной схеме этот параметр описан как массив без объявленного
            items вообще — недосмотр (тот же приём копипасты, что и у UserIdsList).
            Мы транскрибируем содержательный смысл: массив ID сообщений
            (ограничения элементов и maxItems — по требованиям КБ).
          schema:
            type: array
            items:
              $ref: '#/components/schemas/MessageId'
            maxItems: 100
          explode: false
        - name: from
          in: query
          required: false
          description: Время, до которого будут запрошены все сообщения с начала чата (в формате Unix timestamp)
          schema:
            type: integer
            format: int64
            minimum: 0
            maximum: 9007199254740991
          explode: false
        - name: to
          in: query
          required: false
          description: Время, начиная с которого будут запрошены все сообщения до конца чата (в формате Unix timestamp)
          schema:
            type: integer
            format: int64
            minimum: 0
            maximum: 9007199254740991
          explode: false
        - name: count
          in: query
          required: false
          description: Максимальное количество сообщений в ответе
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
            default: 50
          explode: false
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageList'
        '401':
          description: 'Ошибка авторизации: не предоставлен или недействителен access_token'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: 'Ошибка доступа: нет прав на этот ресурс'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      tags:
        - messages
    post:
      operationId: sendMessage
      summary: Отправить сообщение
      description: |-
        Отправляет сообщение в диалог, групповой чат или канал. Можно отправлять
        не более двух сообщений в секунду в один диалог, групповой чат или канал —
        при превышении лимита ставьте сообщения в очередь или делайте задержку
      parameters:
        - name: user_id
          in: query
          required: false
          description: Если вы хотите отправить сообщение пользователю, укажите его ID
          schema:
            type: integer
            format: int64
            minimum: 0
            maximum: 9007199254740991
          explode: false
        - name: chat_id
          in: query
          required: false
          description: Если сообщение отправляется в чат, укажите его ID
          schema:
            type: integer
            format: int64
            minimum: 0
            maximum: 9007199254740991
          explode: false
        - name: disable_link_preview
          in: query
          required: false
          description: Если `true`, сервер не будет генерировать превью для ссылок в тексте сообщения
          schema:
            type: boolean
            default: false
          explode: false
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SendMessageResult'
        '401':
          description: 'Ошибка авторизации: не предоставлен или недействителен access_token'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      tags:
        - messages
        - bot-sending
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewMessageBody'
    put:
      operationId: editMessage
      summary: Редактировать сообщение
      description: |-
        Редактирует сообщения, отправленные ботом. В диалогах с ботом сообщения
        с кнопками `inline_keyboard` редактируются независимо от срока давности,
        остальные — если отправлены менее 7 суток назад; в групповых чатах и
        каналах — независимо от срока давности. Не более двух редактирований в
        секунду в одном диалоге, групповом чате или канале
      parameters:
        - name: message_id
          in: query
          required: true
          description: ID редактируемого сообщения
          schema:
            $ref: '#/components/schemas/MessageId'
          explode: false
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimpleQueryResult'
        '401':
          description: 'Ошибка авторизации: не предоставлен или недействителен access_token'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      tags:
        - messages
        - bot-sending
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewMessageBody'
    delete:
      operationId: deleteMessage
      summary: Удалить сообщение
      description: |-
        Удаляет сообщения в диалоге, групповом чате или канале. Бот должен быть
        администратором и иметь право на удаление сообщений. В диалоге бот может
        удалять только собственные сообщения, в групповом чате и канале — любые.
        Не более двух удалений в секунду в одном диалоге, групповом чате или канале
      parameters:
        - name: message_id
          in: query
          required: true
          description: ID удаляемого сообщения
          schema:
            $ref: '#/components/schemas/MessageId'
          explode: false
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimpleQueryResult'
        '401':
          description: 'Ошибка авторизации: не предоставлен или недействителен access_token'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: 'Ошибка доступа: нет прав на этот ресурс'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      tags:
        - messages
        - bot-sending
  /messages/{messageId}:
    get:
      operationId: getMessageById
      summary: Получить сообщение
      description: Возвращает сообщение по его ID
      parameters:
        - name: messageId
          in: path
          required: true
          description: ID сообщения (`mid`), чтобы получить одно сообщение в чате
          schema:
            $ref: '#/components/schemas/MessageId'
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '401':
          description: 'Ошибка авторизации: не предоставлен или недействителен access_token'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Запрашиваемый ресурс не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      tags:
        - messages
  /subscriptions:
    get:
      operationId: getSubscriptions
      summary: Получение всех подписок через Webhook
      description: Если ваш бот получает данные через Webhook, этот метод возвращает список всех подписок
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetSubscriptionsResult'
        '401':
          description: 'Ошибка авторизации: не предоставлен или недействителен access_token'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      tags:
        - subscriptions
    post:
      operationId: subscribe
      summary: Подписка на обновления о новых событиях через Webhook
      description: Настраивает доставку событий бота через Webhook
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimpleQueryResult'
        '401':
          description: 'Ошибка авторизации: не предоставлен или недействителен access_token'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      tags:
        - subscriptions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubscriptionRequestBody'
    delete:
      operationId: unsubscribe
      summary: Отписка от обновлений о новых событиях через Webhook
      description: Отписывает бота от получения обновлений о новых событиях через Webhook
      parameters:
        - name: url
          in: query
          required: true
          description: URL, который нужно удалить из подписок на WebHook. Webhook-endpoint обязан начинаться с `https://`. 2048 — официальный лимит URL в оригинальной схеме (LinkButton.url, LinkMarkup.url)
          schema:
            type: string
            pattern: ^https://.+$
            maxLength: 2048
          explode: false
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimpleQueryResult'
        '401':
          description: 'Ошибка авторизации: не предоставлен или недействителен access_token'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      tags:
        - subscriptions
  /updates:
    get:
      operationId: getUpdates
      summary: Получение обновлений о событиях через Long Polling
      description: Получение обновлений о событиях через Long Polling
      parameters:
        - name: limit
          in: query
          required: false
          description: Максимальное количество обновлений о событиях, которое может вернуться в ответе на запрос
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 100
          explode: false
        - name: timeout
          in: query
          required: false
          description: Тайм-аут в секундах для долгого опроса
          schema:
            type: integer
            minimum: 0
            maximum: 90
            default: 30
          explode: false
        - name: marker
          in: query
          required: false
          description: Чтобы получить последнее обновление событий, передайте `null` или оставьте поле пустым. Чтобы получить все обновления по событиям с момента предыдущего запроса, передайте значение `marker`, которое получили в ответ на предыдущий запрос
          schema:
            type: integer
            format: int64
            nullable: true
            minimum: 0
            maximum: 9007199254740991
          explode: false
        - name: types
          in: query
          required: false
          description: 'Список типов событий, которые вы хотите получать, например: `message_created`, `message_callback`'
          schema:
            type: array
            items:
              $ref: '#/components/schemas/UpdateType'
            nullable: true
            maxItems: 50
          explode: false
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateList'
        '401':
          description: 'Ошибка авторизации: не предоставлен или недействителен access_token'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '405':
          description: Метод не разрешён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      tags:
        - subscriptions
  /uploads:
    post:
      operationId: getUploadUrl
      summary: Загрузка медиафайлов
      description: |-
        Метод возвращает URL для загрузки медиафайла и токен для передачи
        загруженного файла во вложении к сообщению в чате или канале
      parameters:
        - name: type
          in: query
          required: true
          description: 'Тип загружаемого файла. Возможные значения: `"image"`, `"video"`, `"audio"`, `"file"`'
          schema:
            $ref: '#/components/schemas/UploadType'
          explode: false
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadEndpoint'
        '401':
          description: 'Ошибка авторизации: не предоставлен или недействителен access_token'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      tags:
        - upload
        - bot-sending
  /videos/{videoToken}:
    get:
      operationId: getVideoAttachmentDetails
      summary: Получить информацию о видео
      description: Возвращает подробную информацию о прикреплённом видео, URL-адреса воспроизведения и дополнительные метаданные
      parameters:
        - name: videoToken
          in: path
          required: true
          description: |-
            Токен видео-вложения.

            Паттерн оригинала `[a-zA-Z0-9_\-]+` не заякорен и потому пропускает
            любую строку с одним допустимым символом; заякорен и расширен до
            типовых алфавитов токенов (base64/base64url/hex), maxLength — по
            требованиям КБ: 1024 — в оригинале лимита нет, по аналогии с
            официальным лимитом кнопочного payload (CallbackButton.payload).
            См. DEVIATIONS в scripts/compare.py.
          schema:
            type: string
            pattern: ^[a-zA-Z0-9+/=._\-]+$
            maxLength: 1024
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideoAttachmentDetails'
        '401':
          description: 'Ошибка авторизации: не предоставлен или недействителен access_token'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: 'Ошибка доступа: нет прав на этот ресурс'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Запрашиваемый ресурс не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      tags:
        - messages
security:
  - ApiKeyAuth: []
  - BearerAuth: []
components:
  schemas:
    Attachment:
      oneOf:
        - $ref: '#/components/schemas/PhotoAttachment'
        - $ref: '#/components/schemas/VideoAttachment'
        - $ref: '#/components/schemas/AudioAttachment'
        - $ref: '#/components/schemas/FileAttachment'
        - $ref: '#/components/schemas/StickerAttachment'
        - $ref: '#/components/schemas/ContactAttachment'
        - $ref: '#/components/schemas/InlineKeyboardAttachment'
        - $ref: '#/components/schemas/ShareAttachment'
        - $ref: '#/components/schemas/LocationAttachment'
        - $ref: '#/components/schemas/DataAttachment'
        - $ref: '#/components/schemas/ReplyKeyboardAttachment'
      discriminator:
        propertyName: type
        mapping:
          image: '#/components/schemas/PhotoAttachment'
          video: '#/components/schemas/VideoAttachment'
          audio: '#/components/schemas/AudioAttachment'
          file: '#/components/schemas/FileAttachment'
          sticker: '#/components/schemas/StickerAttachment'
          contact: '#/components/schemas/ContactAttachment'
          inline_keyboard: '#/components/schemas/InlineKeyboardAttachment'
          share: '#/components/schemas/ShareAttachment'
          location: '#/components/schemas/LocationAttachment'
          data: '#/components/schemas/DataAttachment'
          reply_keyboard: '#/components/schemas/ReplyKeyboardAttachment'
      description: Общая схема, представляющая вложение сообщения
    AttachmentPayload:
      type: object
      required:
        - url
      properties:
        url:
          type: string
          maxLength: 2048
          pattern: ^[\w\W]{0,2048}$
          description: |-
            URL медиа-вложения. Этот URL будет получен в объекте Update после
            отправки сообщения в чат.

