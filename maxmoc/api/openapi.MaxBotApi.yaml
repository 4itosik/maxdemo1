        type:
          type: string
          enum:
            - sticker
          description: 'Тип вложения: `sticker`'
        payload:
          allOf:
            - $ref: '#/components/schemas/StickerAttachmentPayload'
          description: Полезная нагрузка вложения-стикера
        width:
          type: integer
          minimum: 0
          maximum: 2147483647
          description: Ширина стикера
        height:
          type: integer
          minimum: 0
          maximum: 2147483647
          description: Высота стикера
      additionalProperties: false
      description: Вложение стикера
    StickerAttachmentPayload:
      type: object
      required:
        - code
      properties:
        code:
          type: string
          maxLength: 255
          pattern: ^[\w\W]{0,255}$
          description: ID стикера
        url:
          type: string
          maxLength: 2048
          pattern: ^[\w\W]{0,2048}$
          description: 'URL медиа-вложения. Этот URL будет получен в объекте Update после

            отправки сообщения в чат.


            Прямую ссылку на видео также можно получить с помощью метода

            `GET /videos/{-videoToken-}`. 2048 — официальный лимит URL в оригинальной

            схеме (LinkButton.url, LinkMarkup.url)'
      additionalProperties: false
      allOf:
        - $ref: '#/components/schemas/AttachmentPayload'
      description: Полезная нагрузка вложения-стикера
    StickerAttachmentRequest:
      type: object
      required:
        - type
        - payload
      properties:
        type:
          type: string
          enum:
            - sticker
          description: 'Тип вложения: `sticker`'
        payload:
          allOf:
            - $ref: '#/components/schemas/StickerAttachmentRequestPayload'
          description: Полезная нагрузка запроса на прикрепление стикера
      additionalProperties: false
      description: Запрос на прикрепление стикера. Должен быть единственным вложением в сообщении
    StickerAttachmentRequestPayload:
      type: object
      required:
        - code
      properties:
        code:
          type: string
          maxLength: 255
          pattern: ^[\w\W]{0,255}$
          description: Код стикера
      additionalProperties: false
      description: Полезная нагрузка запроса на прикрепление стикера
    StrikethroughMarkup:
      type: object
      required:
        - type
        - from
        - length
      properties:
        type:
          type: string
          enum:
            - strikethrough
          description: 'Тип элемента разметки: `strikethrough`'
        from:
          type: integer
          format: int32
          minimum: 0
          maximum: 2147483647
          description: Индекс начала элемента разметки в тексте. Нумерация с нуля
        length:
          type: integer
          format: int32
          minimum: 0
          maximum: 2147483647
          description: Длина элемента разметки
      additionalProperties: false
      description: Представляет ~зачёркнутый~ текст
    StrongMarkup:
      type: object
      required:
        - type
        - from
        - length
      properties:
        type:
          type: string
          enum:
            - strong
          description: 'Тип элемента разметки: `strong`'
        from:
          type: integer
          format: int32
          minimum: 0
          maximum: 2147483647
          description: Индекс начала элемента разметки в тексте. Нумерация с нуля
        length:
          type: integer
          format: int32
          minimum: 0
          maximum: 2147483647
          description: Длина элемента разметки
      additionalProperties: false
      description: Представляет **жирный** текст
    Subscription:
      type: object
      required:
        - url
        - time
        - update_types
      properties:
        url:
          type: string
          maxLength: 2048
          pattern: ^[\w\W]{0,2048}$
          description: URL вебхука. 2048 — официальный лимит URL в оригинальной схеме (LinkButton.url, LinkMarkup.url)
        time:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
          description: Unix-время, когда была создана подписка
        update_types:
          type: array
          items:
            $ref: '#/components/schemas/UpdateType'
          nullable: true
          maxItems: 50
          description: |-
            Типы событий, на которые подписан бот.

            Элементы типизированы scalar-ом `UpdateType` (КБ: pattern + maxLength
            для строк); его `minLength: 1` заодно совпадает с ограничением
            элементов в оригинале.
      additionalProperties: false
      description: Схема для описания подписки на WebHook
    SubscriptionRequestBody:
      type: object
      required:
        - url
      properties:
        url:
          type: string
          maxLength: 2048
          pattern: ^https://.+$
          description: URL HTTPS-endpoint вашего бота. Должен начинаться с `https://`. 2048 — официальный лимит URL в оригинальной схеме (LinkButton.url, LinkMarkup.url)
        update_types:
          type: array
          items:
            $ref: '#/components/schemas/UpdateType'
          maxItems: 50
          description: Список типов событий, которые хочет получать ваш бот
        secret:
          type: string
          minLength: 5
          maxLength: 256
          pattern: ^[a-zA-Z0-9_-]{5,256}$
          description: |-
            Секрет, который должен быть отправлен в заголовке `X-Max-Bot-Api-Secret`
            в каждом запросе Webhook. Разрешены только символы `A-Z`, `a-z`, `0-9`,
            и дефис. Заголовок рекомендован, чтобы запрос поступал из установленного
            веб-узла. 5..256 — значение из официальной схемы MAX
      additionalProperties: false
      description: Запрос на настройку подписки WebHook
    TextFormat:
      type: string
      enum:
        - markdown
        - html
      description: Формат текста сообщения
    UnderlineMarkup:
      type: object
      required:
        - type
        - from
        - length
      properties:
        type:
          type: string
          enum:
            - underline
          description: 'Тип элемента разметки: `underline`'
        from:
          type: integer
          format: int32
          minimum: 0
          maximum: 2147483647
          description: Индекс начала элемента разметки в тексте. Нумерация с нуля
        length:
          type: integer
          format: int32
          minimum: 0
          maximum: 2147483647
          description: Длина элемента разметки
      additionalProperties: false
      description: Представляет подчёркнутый текст
    Update:
      oneOf:
        - $ref: '#/components/schemas/MessageCreatedUpdate'
        - $ref: '#/components/schemas/MessageCallbackUpdate'
        - $ref: '#/components/schemas/MessageEditedUpdate'
        - $ref: '#/components/schemas/MessageRemovedUpdate'
        - $ref: '#/components/schemas/BotAddedToChatUpdate'
        - $ref: '#/components/schemas/BotRemovedFromChatUpdate'
        - $ref: '#/components/schemas/BotStartedUpdate'
        - $ref: '#/components/schemas/BotStoppedUpdate'
        - $ref: '#/components/schemas/ChatTitleChangedUpdate'
        - $ref: '#/components/schemas/DialogClearedUpdate'
        - $ref: '#/components/schemas/DialogMutedUpdate'
        - $ref: '#/components/schemas/DialogUnmutedUpdate'
        - $ref: '#/components/schemas/DialogRemovedUpdate'
        - $ref: '#/components/schemas/UserAddedToChatUpdate'
        - $ref: '#/components/schemas/UserRemovedFromChatUpdate'
        - $ref: '#/components/schemas/MessageChatCreatedUpdate'
      discriminator:
        propertyName: update_type
        mapping:
          message_created: '#/components/schemas/MessageCreatedUpdate'
          message_callback: '#/components/schemas/MessageCallbackUpdate'
          message_edited: '#/components/schemas/MessageEditedUpdate'
          message_removed: '#/components/schemas/MessageRemovedUpdate'
          bot_added: '#/components/schemas/BotAddedToChatUpdate'
          bot_removed: '#/components/schemas/BotRemovedFromChatUpdate'
          bot_started: '#/components/schemas/BotStartedUpdate'
          bot_stopped: '#/components/schemas/BotStoppedUpdate'
          chat_title_changed: '#/components/schemas/ChatTitleChangedUpdate'
          dialog_cleared: '#/components/schemas/DialogClearedUpdate'
          dialog_muted: '#/components/schemas/DialogMutedUpdate'
          dialog_unmuted: '#/components/schemas/DialogUnmutedUpdate'
          dialog_removed: '#/components/schemas/DialogRemovedUpdate'
          user_added: '#/components/schemas/UserAddedToChatUpdate'
          user_removed: '#/components/schemas/UserRemovedFromChatUpdate'
          message_chat_created: '#/components/schemas/MessageChatCreatedUpdate'
      description: |-
        Объект `Update` описывает возможные события в чате или канале. Может
        возвращаться в следующих случаях:
        - вы подписались на обновления через Webhook — при наступлении события
        МАКС пришлёт POST-запрос `/subscriptions`, который содержит объект `Update`;
        - вы отправили GET-запрос `/updates` для получения обновлений через
        Long Polling — в ответ вернётся объект `Update`.
    UpdateList:
      type: object
      required:
        - updates
        - marker
      properties:
        updates:
          type: array
          items:
            $ref: '#/components/schemas/Update'
          maxItems: 1000
          description: Список обновлений о событиях в чатах и каналах, в которые добавлен бот. 1000 — зеркало максимума параметра limit у GET /updates
        marker:
          type: integer
          format: int64
          nullable: true
          minimum: 0
          maximum: 9007199254740991
          description: Указатель на следующую страницу данных
      additionalProperties: false
      description: |-
        Список обновлений о событиях в чатах и каналах, в которые добавлен бот.
        Обратите внимание, чтобы получать события из групповых чатов и каналов,
        бот должен быть администратором
    UpdateType:
      type: string
      minLength: 1
      maxLength: 64
      pattern: ^[a-z_]+$
      description: |-
        Тип события обновления, например `message_created`, `message_callback`.
        Ограничения добавлены по требованиям КБ (pattern + maxLength для строк);
        в оригинале — простая строка. Лимит 64 — по аналогии с официальным
        лимитом коротких имён (`BotCommand.name`).
    UploadEndpoint:
      type: object
      required:
        - url
      properties:
        url:
          type: string
          maxLength: 2048
          pattern: ^[\w\W]{0,2048}$
          description: URL для загрузки медиафайла. Срок жизни ссылки не ограничен. 2048 — официальный лимит URL в оригинальной схеме (LinkButton.url, LinkMarkup.url)
        token:
          type: string
          maxLength: 1024
          pattern: ^[\w\W]{0,1024}$
          description: Токен для отправки медиафайла во вложении к сообщению с помощью POST /messages или PUT /messages. 1024 — в оригинале лимита нет; по аналогии с официальным лимитом кнопочного payload (CallbackButton.payload)
      additionalProperties: false
      description: Точка доступа, куда следует загружать ваши бинарные файлы
    UploadType:
      type: string
      enum:
        - image
        - video
        - audio
        - file
      description: |-
        Тип загружаемого медиафайла. Возможные значения и поддерживаемые форматы:
        - `image` — изображение (JPG, JPEG, PNG, GIF, TIFF, BMP, HEIC). Максимальный
        размер одного изображения: до 50 МБ или не более 7680 x 7680 px — должны
        выполняться оба критерия
        - `video` — видеофайл (MP4, MOV, MKV, WEBM). Максимальный размер одного
        видео: до 250 МБ
        - `audio` — аудиофайл (MP3, WAV, M4A и другие). Максимальный размер одного
        аудио: до 256 МБ или длительностью не более 60 мин — должны выполняться
        оба критерия
        - `file` — файл, поддерживаются распространённые форматы (например, TXT,
        DOC и другие). Максимальный размер одного файла: до 4 ГБ

        При передаче неподдерживаемого типа файла вернётся ошибка
        `File extension is forbidden`.

        Значение `photo` больше не поддерживается. Если вы использовали
        `type=photo` в ранее созданных интеграциях — замените его на `type=image`
    UploadedInfo:
      type: object
      properties:
        token:
          type: string
          maxLength: 1024
          pattern: ^[\w\W]{0,1024}$
          description: Токен — уникальный ID загруженного медиафайла. 1024 — в оригинале лимита нет; по аналогии с официальным лимитом кнопочного payload (CallbackButton.payload)
      additionalProperties: false
      description: Это информация, которую вы получите, как только аудио/видео будет загружено
    User:
      type: object
      required:
        - user_id
        - first_name
        - is_bot
        - last_activity_time
        - name
      properties:
        user_id:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
          description: Идентификатор пользователя или бота
        first_name:
          type: string
          maxLength: 255
          pattern: ^[\w\W]{0,255}$
          description: Отображаемое имя пользователя или бота
        last_name:
          type: string
          nullable: true
          maxLength: 255
          pattern: ^[\w\W]{0,255}$
          description: Отображаемая фамилия пользователя. Для ботов это поле не возвращается
        username:
          type: string
          nullable: true
          maxLength: 255
          pattern: ^[\w\W]{0,255}$
          description: Никнейм бота или уникальное публичное имя пользователя. В случае с пользователем может быть `null`, если тот недоступен или имя не задано
        is_bot:
          type: boolean
          description: '`true`, если это бот'
        last_activity_time:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
          description: Время последней активности пользователя или бота в MAX (Unix-время в миллисекундах). Если пользователь отключил в настройках профиля мессенджера MAX возможность видеть, что он в сети онлайн, поле может не возвращаться
        name:
          type: string
          nullable: true
          maxLength: 255
          pattern: ^[\w\W]{0,255}$
          description: Устаревшее поле, скоро будет удалено
      description: |-
        Объект, описывающий один из вариантов наследования:

        - `User` — объект содержит общую информацию о пользователе или боте без аватара
        - `UserWithPhoto` — объект с общей информацией о пользователе или боте, дополнительно содержит URL аватара и описание
        - `BotInfo` — объект включает общую информацию о боте, URL аватара и описание. Дополнительно содержит список команд, поддерживаемых ботом. Возвращается только при вызове метода `GET /me`
        - `ChatMember` — объект включает общую информацию о пользователе или боте, URL аватара и описание при его наличии. Дополнительно содержит данные для пользователей-участников чата. Возвращается только при вызове некоторых методов группы `/chats`
    UserAddedToChatUpdate:
      type: object
      required:
        - update_type
        - chat_id
        - user
        - is_channel
        - timestamp
      properties:
        update_type:
          type: string
          enum:
            - user_added
          description: 'Тип события: `user_added`'
        chat_id:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
          description: ID чата, где произошло событие. Как получить ID — в разделе «Получение chat_id»
        user:
          allOf:
            - $ref: '#/components/schemas/User'
          description: Пользователь, добавленный в чат
        inviter_id:
          type: integer
          format: int64
          nullable: true
          minimum: 0
          maximum: 9007199254740991
          description: |-
            Пользователь, который добавил нового пользователя в чат. Может быть
            `null`, если пользователь присоединился к чату по ссылке
        is_channel:
          type: boolean
          description: Указывает, что пользователь добавлен в канал, а не в чат
        timestamp:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
          description: Unix-время, когда произошло событие
      additionalProperties: false
      description: |-
        Вы получите это событие, как только пользователь будет добавлен в чат,
        где бот является администратором
    UserMentionMarkup:
      type: object
      required:
        - type
        - from
        - length
      properties:
        type:
          type: string
          enum:
            - user_mention
          description: 'Тип элемента разметки: `user_mention`'
        user_link:
          type: string
          nullable: true
          maxLength: 255
          pattern: ^[\w\W]{0,255}$
          description: '`@username` упомянутого пользователя'
        user_id:
          type: integer
          format: int64
          nullable: true
          minimum: 0
          maximum: 9007199254740991
          description: ID упомянутого пользователя без имени
        from:
          type: integer
          format: int32
          minimum: 0
          maximum: 2147483647
          description: Индекс начала элемента разметки в тексте. Нумерация с нуля
        length:
          type: integer
          format: int32
          minimum: 0
          maximum: 2147483647
          description: Длина элемента разметки
      additionalProperties: false
      description: Представляет упоминание пользователя в тексте. Упоминание может быть как по имени пользователя, так и по ID, если у пользователя нет имени
    UserRemovedFromChatUpdate:
      type: object
      required:
        - update_type
        - chat_id
        - user
        - is_channel
        - timestamp
      properties:
        update_type:
          type: string
          enum:
            - user_removed
          description: 'Тип события: `user_removed`'
        chat_id:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
          description: ID чата, где произошло событие. Как получить ID — в разделе «Получение chat_id»
        user:
          allOf:
            - $ref: '#/components/schemas/User'
          description: Пользователь, удалённый из чата
        admin_id:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
          description: |-
            Администратор, который удалил пользователя из чата. Может быть `null`,
            если пользователь покинул чат сам
        is_channel:
          type: boolean
          description: Указывает, что пользователь удалён из канала, а не из чата
        timestamp:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
          description: Unix-время, когда произошло событие
      additionalProperties: false
      description: |-
        Вы получите это событие, как только пользователь будет удалён из чата,
        где бот является администратором
    UserWithPhoto:
      type: object
      properties:
        description:
          type: string
          nullable: true
          maxLength: 16000
          pattern: ^[\w\W]{0,16000}$
          description: Описание пользователя или бота. В случае с пользователем может принимать значение `null`, если описание не заполнено. 16000 — значение из официальной схемы MAX
        avatar_url:
          type: string
          maxLength: 2048
          pattern: ^[\w\W]{0,2048}$
          description: URL аватара пользователя или бота в уменьшенном размере. 2048 — официальный лимит URL в оригинальной схеме (LinkButton.url, LinkMarkup.url)
        full_avatar_url:
          type: string
          maxLength: 2048
          pattern: ^[\w\W]{0,2048}$
          description: URL аватара пользователя или бота в полном размере. 2048 — официальный лимит URL в оригинальной схеме (LinkButton.url, LinkMarkup.url)
      allOf:
        - $ref: '#/components/schemas/User'
      description: Объект с общей информацией о пользователе или боте. Является наследником схемы User — дополнительно к ней содержит URL аватара и описание
    VideoAttachment:
      type: object
      required:
        - type
        - payload
      properties:
        type:
          type: string
          enum:
            - video
          description: 'Тип вложения: `video`'
        payload:
          allOf:
            - $ref: '#/components/schemas/MediaAttachmentPayload'
          description: Полезная нагрузка видео-вложения
        thumbnail:
          type: object
          allOf:
            - $ref: '#/components/schemas/VideoThumbnail'
          nullable: true
          description: Миниатюра видео
        width:
          type: integer
          nullable: true
          minimum: 0
          maximum: 2147483647
          description: Ширина видео
        height:
          type: integer
          nullable: true
          minimum: 0
          maximum: 2147483647
          description: Высота видео
        duration:
          type: integer
          nullable: true
          minimum: 0
          maximum: 2147483647
          description: Длина видео в секундах
      additionalProperties: false
      description: Вложение видео
    VideoAttachmentDetails:
      type: object
      required:
        - token
        - width
        - height
        - duration
      properties:
        token:
          type: string
          maxLength: 1024
          pattern: ^[\w\W]{0,1024}$
          description: Токен видео-вложения. 1024 — в оригинале лимита нет; по аналогии с официальным лимитом кнопочного payload (CallbackButton.payload)
        urls:
          type: object
          allOf:
            - $ref: '#/components/schemas/VideoUrls'
          nullable: true
          description: URL-ы для скачивания или воспроизведения видео. Может быть `null`, если видео недоступно
        thumbnail:
          type: object
          allOf:
            - $ref: '#/components/schemas/PhotoAttachmentPayload'
          nullable: true
          description: Миниатюра видео
        width:
          type: integer
          minimum: 0
          maximum: 2147483647
          description: Ширина видео
        height:
          type: integer
          minimum: 0
          maximum: 2147483647
          description: Высота видео
        duration:
          type: integer
          minimum: 0
          maximum: 2147483647
          description: Длина видео в секундах
      additionalProperties: false
      description: Подробная информация о видео-вложении
    VideoAttachmentRequest:
      type: object
      required:
        - type
        - payload
      properties:
        type:
          type: string
          enum:
            - video
          description: 'Тип вложения: `video`'
        payload:
          allOf:
            - $ref: '#/components/schemas/UploadedInfo'
          description: Полезная нагрузка запроса на прикрепление видео
      additionalProperties: false
      description: Запрос на прикрепление видео к сообщению
    VideoThumbnail:
      type: object
      required:
        - url
      properties:
        url:
          type: string
          maxLength: 2048
          pattern: ^[\w\W]{0,2048}$
          description: URL изображения. 2048 — официальный лимит URL в оригинальной схеме (LinkButton.url, LinkMarkup.url)
      additionalProperties: false
      description: Миниатюра видео
    VideoUrls:
      type: object
      properties:
        mp4_1080:
          type: string
          nullable: true
          maxLength: 2048
          pattern: ^[\w\W]{0,2048}$
          description: URL видео в разрешении 1080p, если доступно
        mp4_720:
          type: string
          nullable: true
          maxLength: 2048
          pattern: ^[\w\W]{0,2048}$
          description: URL видео в разрешении 720p, если доступно
        mp4_480:
          type: string
          nullable: true
          maxLength: 2048
          pattern: ^[\w\W]{0,2048}$
          description: URL видео в разрешении 480p, если доступно
        mp4_360:
          type: string
          nullable: true
          maxLength: 2048
          pattern: ^[\w\W]{0,2048}$
          description: URL видео в разрешении 360p, если доступно
        mp4_240:
          type: string
          nullable: true
          maxLength: 2048
          pattern: ^[\w\W]{0,2048}$
          description: URL видео в разрешении 240p, если доступно
        mp4_144:
          type: string
          nullable: true
          maxLength: 2048
          pattern: ^[\w\W]{0,2048}$
          description: URL видео в разрешении 144p, если доступно
        hls:
          type: string
          nullable: true
          maxLength: 2048
          pattern: ^[\w\W]{0,2048}$
          description: URL трансляции, если доступна
      additionalProperties: false
      description: |-
        URL-ы видео в разных разрешениях.

        Лимит 2048 у всех полей — официальный лимит URL в оригинальной схеме
        (LinkButton.url, LinkMarkup.url).
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: query
      name: access_token
    BearerAuth:
      type: http
      scheme: Bearer
servers:
  - url: https://platform-api2.max.ru
    variables: {}
