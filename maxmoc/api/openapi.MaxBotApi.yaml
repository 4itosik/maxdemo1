      additionalProperties: false
      description: Токен, полученный после загрузки изображения
    QuoteMarkup:
      type: object
      required:
        - type
        - from
        - length
      properties:
        type:
          type: string
          enum:
            - quote
          description: 'Тип элемента разметки: `quote`'
        from:
          type: integer
          format: int32
          minimum: 0
          maximum: 2147483647
          description: Индекс начала элемента разметки в тексте. Нумерация с нуля
        length:
          type: integer
          format: int32
          minimum: 0
          maximum: 2147483647
          description: Длина элемента разметки
      additionalProperties: false
      description: Представляет цитату
    Recipient:
      type: object
      required:
        - chat_id
        - chat_type
        - user_id
      properties:
