        payload:
          type: string
          nullable: true
          maxLength: 1024
          pattern: ^[\w\W]{0,1024}$
          description: Токен кнопки. 1024 — значение из официальной схемы MAX
      additionalProperties: false
      description: После нажатия на такую кнопку клиент отправляет сообщение от лица пользователя с заданной полезной нагрузкой
    SendMessageResult:
