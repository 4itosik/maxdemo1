openapi: 3.0.0
info:
  title: Max Bot Webhook
  description: |-
    Контракт webhook-эндпоинта, который реализует РАЗРАБОТЧИК БОТА (а не
    платформа MAX). После регистрации URL через `POST /subscriptions`
    платформа доставляет события бота HTTPS POST-запросами на этот эндпоинт.

    Требования платформы: HTTPS, порт 443, сертификат от доверенного центра
    (самоподписные и HTTP не поддерживаются с 25 мая 2026). Отвечайте 200 OK
    как можно быстрее; обработку события выполняйте после ответа.
  version: 0.0.0
tags:
  - name: webhook-server
paths:
  /:
    post:
      operationId: WebhookReceiver_receiveUpdate
      summary: Приём события от платформы MAX
      description: |-
        Приём события от платформы MAX. Тело описано двумя эквивалентными
        способами (anyOf — любое событие соответствует обоим):
        `UpdateUnified` — единая «плоская» схема (общие поля обязательны,
        вариативные опциональны, у каждого указано, при каких `update_type`
        приходит); `WebhookUpdate` — строгий oneOf из 16 конкретных типов
        для типизированной кодогенерации.

        Если при подписке был задан `secret`, платформа передаёт его в заголовке
        `X-Max-Bot-Api-Secret` — проверяйте его, чтобы убедиться, что запрос
        пришёл от MAX, а не от постороннего.
      parameters:
        - name: X-Max-Bot-Api-Secret
          in: header
          required: false
          description: Секрет, заданный при создании подписки (см. SubscriptionRequestBody.secret)
          schema:
            type: string
      responses:
        '200':
          description: 'Подтверждение приёма: платформа ожидает 200 OK без тела'
      tags:
        - webhook-server
      requestBody:
        required: true
        content:
          application/json:
            schema:
              anyOf:
                - $ref: '#/components/schemas/UpdateUnified'
                - $ref: '#/components/schemas/WebhookUpdate'
        description: Событие; какие поля заполнены — определяется значением update_type
components:
  schemas:
    MaxBotApi.Attachment:
      type: object
      required:
        - type
      properties:
        type:
          type: string
          description: Тип вложения
      discriminator:
        propertyName: type
        mapping:
          image: '#/components/schemas/MaxBotApi.PhotoAttachment'
          video: '#/components/schemas/MaxBotApi.VideoAttachment'
          audio: '#/components/schemas/MaxBotApi.AudioAttachment'
          file: '#/components/schemas/MaxBotApi.FileAttachment'
          sticker: '#/components/schemas/MaxBotApi.StickerAttachment'
          contact: '#/components/schemas/MaxBotApi.ContactAttachment'
          inline_keyboard: '#/components/schemas/MaxBotApi.InlineKeyboardAttachment'
          share: '#/components/schemas/MaxBotApi.ShareAttachment'
          location: '#/components/schemas/MaxBotApi.LocationAttachment'
          data: '#/components/schemas/MaxBotApi.DataAttachment'
          reply_keyboard: '#/components/schemas/MaxBotApi.ReplyKeyboardAttachment'
      description: Общая схема, представляющая вложение сообщения
    MaxBotApi.AttachmentPayload:
      type: object
      required:
        - url
      properties:
        url:
          type: string
          description: |-
            URL медиа-вложения. Этот URL будет получен в объекте Update после
            отправки сообщения в чат.

            Прямую ссылку на видео также можно получить с помощью метода
            `GET /videos/{-videoToken-}`
      description: Базовая полезная нагрузка медиа-вложения
    MaxBotApi.AudioAttachment:
      type: object
      required:
        - type
        - payload
      properties:
        type:
          type: string
          enum:
            - audio
        payload:
          allOf:
            - $ref: '#/components/schemas/MaxBotApi.MediaAttachmentPayload'
          description: Полезная нагрузка аудио-вложения
        transcription:
          type: string
          nullable: true
          description: Аудио транскрипция
      allOf:
        - $ref: '#/components/schemas/MaxBotApi.Attachment'
      description: Вложение аудио
    MaxBotApi.BotAddedToChatUpdate:
      type: object
      required:
        - update_type
        - chat_id
        - user
        - is_channel
      properties:
        update_type:
          type: string
          enum:
            - bot_added
        chat_id:
          type: integer
          format: int64
          description: ID чата, куда был добавлен бот. Как получить ID — в разделе «Получение chat_id»
        user:
          allOf:
            - $ref: '#/components/schemas/MaxBotApi.User'
          description: Пользователь, добавивший бота в чат
        is_channel:
          type: boolean
          description: Указывает, что бот добавлен в канал, а не в чат
      allOf:
        - $ref: '#/components/schemas/MaxBotApi.Update'
      description: Вы получите это событие, как только бот будет добавлен в чат или канал
    MaxBotApi.BotCommand:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
          description: Название команды
        description:
          type: string
          nullable: true
          minLength: 1
          maxLength: 128
          description: Описание команды
      description: Команда, поддерживаемая ботом
    MaxBotApi.BotInfo:
      type: object
      properties:
        commands:
          type: array
          items:
            $ref: '#/components/schemas/MaxBotApi.BotCommand'
          nullable: true
          maxItems: 32
          description: Команды, поддерживаемые ботом
      allOf:
        - $ref: '#/components/schemas/MaxBotApi.UserWithPhoto'
      description: Объект включает общую информацию о боте, URL аватара и описание. Является наследником схемы UserWithPhoto. Дополнительно к ней содержит список команд, поддерживаемых ботом. Возвращается только при вызове метода `GET /me`
    MaxBotApi.BotRemovedFromChatUpdate:
      type: object
      required:
        - update_type
        - chat_id
        - user
        - is_channel
      properties:
        update_type:
          type: string
          enum:
            - bot_removed
        chat_id:
          type: integer
          format: int64
          description: ID чата, откуда был удалён бот. Как получить ID — в разделе «Получение chat_id»
        user:
          allOf:
            - $ref: '#/components/schemas/MaxBotApi.User'
          description: Пользователь, удаливший бота из чата
        is_channel:
          type: boolean
          description: Указывает, что бот удалён из канала, а не из чата
      allOf:
        - $ref: '#/components/schemas/MaxBotApi.Update'
      description: Вы получите это событие, как только бот будет удалён из чата
    MaxBotApi.BotStartedUpdate:
      type: object
      required:
        - update_type
        - chat_id
        - user
      properties:
        update_type:
          type: string
          enum:
            - bot_started
        chat_id:
          type: integer
          format: int64
          description: ID диалога, где произошло событие. Как получить ID — в разделе «Получение chat_id»
        user:
          allOf:
            - $ref: '#/components/schemas/MaxBotApi.User'
          description: Пользователь, который нажал кнопку `Start`
        payload:
          type: string
          nullable: true
          maxLength: 512
          description: Дополнительные данные из диплинков, переданные при запуске бота
        user_locale:
          type: string
          description: Текущий язык пользователя в формате IETF BCP 47
      allOf:
        - $ref: '#/components/schemas/MaxBotApi.Update'
      description: |-
        Вы получите это событие, как только пользователь начнёт или возобновит
        общение с ботом: нажмёт соответствующую кнопку в настройках бота в МАКС
    MaxBotApi.BotStoppedUpdate:
      type: object
      required:
        - update_type
        - chat_id
        - user
      properties:
        update_type:
          type: string
          enum:
            - bot_stopped
        chat_id:
          type: integer
          format: int64
          description: ID диалога, где произошло событие. Как получить ID — в разделе «Получение chat_id»
        user:
          allOf:
            - $ref: '#/components/schemas/MaxBotApi.User'
          description: Пользователь, который остановил бота
        user_locale:
          type: string
          description: Текущий язык пользователя в формате IETF BCP 47
      allOf:
        - $ref: '#/components/schemas/MaxBotApi.Update'
      description: Вы получите это событие, как только пользователь остановит бота в его настройках в МАКС
    MaxBotApi.Button:
      type: object
      required:
        - text
        - type
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 128
          description: 'Видимый текст кнопки. Чтобы он отображался полностью, рекомендуем не превышать заданное количество символов в зависимости от размещения текста: `20` символов — при 1 кнопке в ряду, `10` — при 2, `5` — при 3, `3` — при 4'
        type:
          type: string
          description: Discriminator property for Button.
      discriminator:
        propertyName: type
        mapping:
          callback: '#/components/schemas/MaxBotApi.CallbackButton'
          link: '#/components/schemas/MaxBotApi.LinkButton'
          request_geo_location: '#/components/schemas/MaxBotApi.RequestGeoLocationButton'
          request_contact: '#/components/schemas/MaxBotApi.RequestContactButton'
          chat: '#/components/schemas/MaxBotApi.ChatButton'
          open_app: '#/components/schemas/MaxBotApi.OpenAppButton'
          clipboard: '#/components/schemas/MaxBotApi.ClipboardButton'
          message: '#/components/schemas/MaxBotApi.MessageButton'
      description: Кнопка клавиатуры
    MaxBotApi.Callback:
      type: object
      required:
        - timestamp
        - callback_id
        - user
      properties:
        timestamp:
          type: integer
          format: int64
          description: Unix-время, когда пользователь нажал кнопку
        callback_id:
          type: string
          description: Текущий ID клавиатуры
        payload:
          type: string
          description: Токен кнопки
        user:
          allOf:
            - $ref: '#/components/schemas/MaxBotApi.User'
          description: Пользователь, нажавший на кнопку
      description: Объект, отправленный боту, когда пользователь нажимает кнопку
    MaxBotApi.CallbackButton:
      type: object
      required:
        - type
        - payload
      properties:
        type:
          type: string
          enum:
            - callback
        payload:
          type: string
          maxLength: 1024
          description: Токен кнопки
      allOf:
        - $ref: '#/components/schemas/MaxBotApi.Button'
      description: После нажатия на такую кнопку клиент отправляет на сервер полезную нагрузку
    MaxBotApi.Chat:
      type: object
      required:
        - chat_id
        - type
        - status
        - title
        - icon
        - last_event_time
        - participants_count
        - is_public
        - description
      properties:
        chat_id:
          type: integer
          format: int64
          description: ID чата или канала — в зависимости от ограничений метода и от того, с чем вы работаете. Как получить ID — в разделе «Получение chat_id»
        type:
          allOf:
            - $ref: '#/components/schemas/MaxBotApi.ChatType'
          description: 'Тип чата: `"chat"` — Групповой чат, `"channel"` — Канал, `"dialog"` — Диалог'
        status:
          allOf:
            - $ref: '#/components/schemas/MaxBotApi.ChatStatus'
          description: 'Статус чата: `"active"` — Бот является активным участником чата, `"removed"` — Бот был удалён из чата, `"left"` — Бот покинул чат, `"closed"` — Чат был закрыт'
        title:
          type: string
          nullable: true
          description: Отображаемое название чата или канала. Может быть `null` для диалогов
        icon:
          type: object
          allOf:
            - $ref: '#/components/schemas/MaxBotApi.Image'
          nullable: true
          description: Иконка чата или канала
        last_event_time:
          type: integer
          format: int64
          description: Время последнего события в чате или канале
        participants_count:
          type: integer
          format: int32
          description: Количество участников чата или канала. Для диалогов всегда `2`
        owner_id:
          type: integer
          format: int64
          nullable: true
          description: ID владельца чата или канала
        participants:
          type: object
          additionalProperties:
            type: integer
            format: int64
          nullable: true
          description: Участники чата или канала с временем последней активности. Может быть `null`, если запрашивается список чатов
        is_public:
          type: boolean
          description: Доступен ли чат публично (для диалогов всегда `false`)
        link:
          type: string
          nullable: true
          description: Ссылка на чат
        description:
          type: string
          nullable: true
          description: Описание чата или канала
        dialog_with_user:
          type: object
          allOf:
            - $ref: '#/components/schemas/MaxBotApi.UserWithPhoto'
          nullable: true
          description: Данные о пользователе в диалоге (только для чатов типа `"dialog"`)
        messages_count:
          type: integer
          nullable: true
          description: Количество сообщений в групповых чатах и каналах
        pinned_message:
          type: object
          allOf:
            - $ref: '#/components/schemas/MaxBotApi.Message'
          nullable: true
          description: Закреплённое сообщение в чате (возвращается только при запросе конкретного чата или канала)
      description: |-
        Объект содержит общую информацию о групповом чате или канале: его тип,
        настройки отображения (название, аватар, описание, ссылка), публичную
        доступность, а также информацию об участниках (владельце, боте и других
        пользователях), времени их последней активности и событиях
    MaxBotApi.ChatAdminPermission:
      type: string
      enum:
        - read_all_messages
        - add_remove_members
        - add_admins
        - change_chat_info
        - pin_message
        - write
        - can_call
        - edit_link
        - post_edit_delete_message
        - edit_message
        - delete_message
        - edit
        - delete
      description: Права администратора группового чата или канала
    MaxBotApi.ChatButton:
      type: object
      required:
        - type
        - chat_title
      properties:
        type:
          type: string
          enum:
            - chat
        chat_title:
          type: string
          maxLength: 200
          description: Название чата, который будет создан
        chat_description:
          type: string
          nullable: true
          maxLength: 400
          description: Описание чата
        start_payload:
          type: string
          nullable: true
          maxLength: 512
          description: Стартовая полезная нагрузка будет отправлена боту, как только чат будет создан
        uuid:
          type: integer
          nullable: true
          description: |-
            Уникальный ID кнопки среди всех кнопок чата на клавиатуре.
            Если `uuid` изменён, новый чат будет создан при следующем нажатии.
            Сервер сгенерирует его в момент, когда кнопка будет впервые размещена.
            Используйте его при редактировании сообщения.
      allOf:
        - $ref: '#/components/schemas/MaxBotApi.Button'
      description: |-
        Кнопка, которая создает новый чат, как только первый пользователь на нее нажмёт.
        Бот будет добавлен в участники чата как администратор.
        Автор сообщения станет владельцем чата.

        В оригинальной схеме отсутствует в `Button.discriminator.mapping` — см.
        DEVIATIONS `mapping[chat]` в scripts/compare.py: литерал "chat" выведен по
        конвенции соседних ключей (тот же приём, что и для `DataAttachment`).
    MaxBotApi.ChatMember:
      type: object
      required:
        - last_access_time
        - is_owner
        - is_admin
        - join_time
        - permissions
      properties:
        last_access_time:
          type: integer
          format: int64
          description: Время последней активности пользователя в чате. Может быть устаревшим для суперчатов (равно времени вступления)
        is_owner:
          type: boolean
          description: Является ли пользователь владельцем группового чата или канала
        is_admin:
          type: boolean
          description: Является ли пользователь администратором группового чата или канала
        join_time:
          type: integer
          format: int64
          description: Дата присоединения к чату в формате Unix time
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/MaxBotApi.ChatAdminPermission'
          nullable: true
          description: |-
            Перечень прав доступа пользователя или бота, если тот является
            администратором группового чата или канала. Для обычных участников чата
            или канала поле не возвращается
        alias:
          type: string
          description: |-
            Описание роли, которое будет отображаться на клиентском устройстве в
            настройках чата или канала рядом с именем пользователя
      allOf:
        - $ref: '#/components/schemas/MaxBotApi.UserWithPhoto'
      description: |-
        Объект включает общую информацию о пользователе или боте, URL аватара и
        описание (при наличии). Является наследником схемы UserWithPhoto.
        Дополнительно к ней содержит данные для пользователей-участников чата или
        канала. Возвращается только при вызове некоторых методов группы `/chats`
    MaxBotApi.ChatStatus:
      type: string
      enum:
        - active
        - removed
        - left
        - closed
      description: Статус чата для текущего бота
    MaxBotApi.ChatTitleChangedUpdate:
      type: object
      required:
        - update_type
        - chat_id
        - user
        - title
      properties:
        update_type:
          type: string
          enum:
            - chat_title_changed
        chat_id:
          type: integer
          format: int64
          description: ID чата, где произошло событие. Как получить ID — в разделе «Получение chat_id»
        user:
          allOf:
            - $ref: '#/components/schemas/MaxBotApi.User'
          description: Пользователь, который изменил название
        title:
          type: string
          description: Новое название
      allOf:
        - $ref: '#/components/schemas/MaxBotApi.Update'
      description: Вы получите это событие, как только будет изменено название чата
    MaxBotApi.ChatType:
      type: string
      enum:
        - chat
      description: 'Тип чата: диалог, чат'
    MaxBotApi.ClipboardButton:
      type: object
      required:
        - type
        - payload
      properties:
        type:
          type: string
          enum:
            - clipboard
        payload:
          type: string
          maxLength: 1024
          description: Текст, который будет скопирован
      allOf:
        - $ref: '#/components/schemas/MaxBotApi.Button'
      description: При нажатии на кнопку с типом `clipboard` текст, указанный в свойстве `payload`, копируется в буфер обмена
    MaxBotApi.ContactAttachment:
      type: object
      required:
        - type
        - payload
      properties:
        type:
          type: string
          enum:
            - contact
        payload:
          allOf:
            - $ref: '#/components/schemas/MaxBotApi.ContactAttachmentPayload'
          description: Полезная нагрузка вложения-контакта
      allOf:
        - $ref: '#/components/schemas/MaxBotApi.Attachment'
      description: Вложение с карточкой контакта
    MaxBotApi.ContactAttachmentPayload:
      type: object
      properties:
        vcf_info:
          type: string
          nullable: true
          description: Информация о пользователе в формате VCF
        hash:
          type: string
          nullable: true
          description: |-
            Хеш информации о пользователе в формате VCF. Используется для проверки
            того, что пользователь поделился номером телефона, привязанным к его
            аккаунту в МАКС. Подробнее — в разделе «Типы кнопок»
        max_info:
          type: object
          allOf:
            - $ref: '#/components/schemas/MaxBotApi.User'
          nullable: true
          description: Информация о пользователе
      description: Полезная нагрузка вложения-контакта
    MaxBotApi.DataAttachment:
      type: object
      required:
        - type
        - data
      properties:
        type:
          type: string
          enum:
            - data
        data:
          type: string
          description: Полезная нагрузка, отправленная через SendMessageButton
      allOf:
        - $ref: '#/components/schemas/MaxBotApi.Attachment'
      description: |-
        Вложение, содержащее полезную нагрузку, отправленную через `SendMessageButton`.

        В оригинальной схеме отсутствует в `Attachment.discriminator.mapping` —
        см. DEVIATIONS `mapping[data]` в scripts/compare.py (тот же приём, что и
        для `ChatButton`).
    MaxBotApi.DialogClearedUpdate:
      type: object
      required:
        - update_type
        - chat_id
        - user
      properties:
        update_type:
          type: string
          enum:
            - dialog_cleared
        chat_id:
          type: integer
          format: int64
          description: ID чата, где произошло событие. Как получить ID — в разделе «Получение chat_id»
        user:
          allOf:
            - $ref: '#/components/schemas/MaxBotApi.User'
          description: Пользователь, который очистил историю сообщений
        user_locale:
          type: string
          description: Текущий язык пользователя в формате IETF BCP 47
      allOf:
        - $ref: '#/components/schemas/MaxBotApi.Update'
      description: Вы получите это событие, как только пользователь очистит историю сообщений
    MaxBotApi.DialogMutedUpdate:
      type: object
      required:
        - update_type
        - chat_id
        - user
        - muted_until
      properties:
