# Конфигурация max-mock. Любое поле можно опустить — возьмётся значение по умолчанию.
listen: ":8080"

# База для генерируемых ссылок (upload-эндпоинт, ссылки на вложения).
# Должна быть адресом, по которому мок доступен со стендов КЦ.
public_base_url: "http://localhost:8080"

db_path: "max-mock.db"
blob_dir: "blobs"

# Через сколько дней чистить журналы запросов и доставок. 0 — не чистить.
log_retention_days: 14

# Валидировать собственные ответы против openapi.MaxBotApi.yaml.
# Ловит расхождения с контрактом до того, как их увидит КЦ. Выключать только
# если валидация стала узким местом.
validate_responses: true

# Консольный лог: строка на каждый вызов Bot API, действие тестировщика в
# веб-чате и попытку доставки вебхука. Журналы в базе, которые читает UI, он не
# заменяет — те хранят историю, этот показывает, что мок жив и что через него
# идёт прямо сейчас.
log:
  format: "text"   # text — key=value для глаз, json — для сборщика логов
  level: "info"    # debug добавляет отдачу статики, страниц и /healthz
  # Сколько байт тела запроса или ответа попадает в строку. 0 — не печатать
  # тела вовсе. Обработчик всегда получает запрос целиком: предел только на лог.
  body_limit: 4096

# HTTPS на том же порту. Заданные оба поля включают TLS, пустой блок
# оставляет обычный HTTP. При включённом TLS public_base_url обязан
# начинаться с https:// — иначе мок не стартует.
# tls:
#   cert_file: "/etc/max-mock/tls/server.crt"   # PEM, вместе с промежуточными
#   key_file:  "/etc/max-mock/tls/server.key"

webhook:
  timeout_sec: 10
  retries: 2
  backoff_sec: [1, 5]

  # Удостоверяющий центр контура — для доставки на стенды по https.
  # Добавляется к системным корневым, не заменяя их. Пусто — обычная
  # проверка по системным корневым.
  # ca_file: "/etc/max-mock/tls/stand-ca.crt"

  # Не проверять сертификаты стендов вообще. Аварийная мера: мок предупреждает
  # об этом при каждом старте.
  insecure_skip_verify: false
