        и потому пропускает вообще любую строку с одним допустимым символом
        (см. DEVIATIONS в scripts/compare.py). Ограничения добавлены по
        требованиям КБ (pattern + maxLength для строк).
    MaxBotApi.MessageLinkType:
      type: string
      enum:
        - forward
        - reply
