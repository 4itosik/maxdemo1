# --- oneOf/allOf/anyOf в этом документе: что осталось и почему ---
# Композитных позиций — 59; у каждой ниже стоит однострочный комментарий с буквой
# случая. Всё оставшееся — либо форма, скопированная из официального контракта MAX
# (reference/max-openapi-official.json — снимок schema_2026_08_11.json, API 0.0.33; он же
# на dev.max.ru/docs-api/objects/<Имя>), либо ограничение самого OpenAPI 3.0.
# Подробный разбор — maxapi/README.md, «Что остаётся композитным — и почему это потолок».
#
# [A] oneOf + discriminator + description — 6 поз. Базы полиморфных полей: updates[],
#     attachments[], markup[], ряды кнопок, тело вебхука; discriminator и description —
#     часть той же конструкции. В оригинале те же шесть дискриминаторов, но варианты
#     подключены к базе через allOf: при такой записи у полиморфного поля проверяются
#     только свойства базы — из 13 некорректных тел kin-openapi пропускал 11, теперь ноль.
#
# [B] allOf вокруг одиночного $ref + description — 39 поз. В OpenAPI 3.0 соседи $ref
#     игнорируются: без обёртки описание поля пропало бы, а форму {$ref, description}
#     kin-openapi и Spectral не принимают вовсе. Переход на 3.1 проверен — хуже,
#     206 композитных позиций вместо 130.
#     В оригинале 54 таких же позиций: Chat.type, Chat.status, Message.sender.
#
# [C] allOf вокруг одиночного $ref + nullable — 9 поз. То же ограничение 3.0, но на
#     кону семантика: без обёртки nullable игнорируется и поле перестаёт принимать null.
#     В оригинале 17 таких позиций: Chat.icon, Chat.pinned_message, Message.link.
#
# [D] allOf-наследование без дискриминатора — 4 поз. Union'ами эти семейства не
#     являются, в oneOf не сводятся; расплющивание сделало бы базу AttachmentPayload
#     недостижимой, а у UserWithPhoto молча потеряло бы 7 свойств.
#     В оригинале (54 поз.) те же схемы записаны один в один: FileAttachmentPayload,
#     MediaAttachmentPayload, StickerAttachmentPayload, UserWithPhoto.
#
# [E] anyOf без соседних ключей — 1 поз. Тело вебхука: на выбор плоская UpdateUnified
#     или строгий oneOf WebhookUpdate, посторонних ключей рядом нет. anyOf проходит при
#     совпадении любой ветви, поэтому свои исходящие события сверяйте прямо со схемой
#     WebhookUpdate. В оригинале аналога нет — webhook-контракт MAX не публикует.
#
# Итого: в официальной схеме MAX 125 композитных позиций (54 [B], 17 [C],
# 54 [D]), в этом документе — 59. Настоящего allOf-наследования почти не осталось:
# шесть семейств переписаны в oneOf + discriminator.
# --- конец ---
openapi: 3.0.0
info:
  title: Max Bot Webhook
  contact:
    name: Max Bot Webhook (placeholder)
    url: https://dev.max.ru/docs-api
    email: bot-api-placeholder@example.com
  description: |-
    Контракт webhook-эндпоинта, который реализует РАЗРАБОТЧИК БОТА (а не
    платформа MAX). После регистрации URL через `POST /subscriptions`
    платформа доставляет события бота HTTPS POST-запросами на этот эндпоинт.

    Требования платформы: HTTPS, порт 443, сертификат от доверенного центра
    (самоподписные и HTTP не поддерживаются с 25 мая 2026). Отвечайте 200 OK
    как можно быстрее; обработку события выполняйте после ответа.
  version: 0.0.0
tags:
  - name: webhook-server
paths:
  /max/v1.0/webhooks/{integrationId}:
    post:
      operationId: WebhookReceiver_receiveUpdate
      summary: Приём события от платформы MAX
      description: |-
        Приём события от платформы MAX. Тело описано двумя эквивалентными
        способами (anyOf — любое событие соответствует обоим):
        `UpdateUnified` — единая «плоская» схема (общие поля обязательны,
        вариативные опциональны, у каждого указано, при каких `update_type`
        приходит); `WebhookUpdate` — строгий oneOf из 16 конкретных типов
        для типизированной кодогенерации.

        Если при подписке был задан `secret`, платформа передаёт его в заголовке
        `X-Max-Bot-Api-Secret` — проверяйте его, чтобы убедиться, что запрос
        пришёл от MAX, а не от постороннего.
      parameters:
        - name: integrationId
          in: path
          required: true
          description: |-
            Идентификатор интеграции — последний сегмент URL, который вы
            регистрируете через `POST /subscriptions`. UUID (RFC 4122): 36
            символов, hex-группы 8-4-4-4-12 через дефисы. Тип строковый, а не
            отдельный uuid-скаляр: в OpenAPI 3.0 `format: uuid` — только
            аннотация, реально ограничивают pattern и длина.
          schema:
            type: string
            format: uuid
            pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
            minLength: 36
            maxLength: 36
        - name: X-Max-Bot-Api-Secret
          in: header
          required: false
          description: Секрет, заданный при создании подписки (см. SubscriptionRequestBody.secret). 5..256 — значение из официальной схемы MAX
          schema:
            type: string
            pattern: ^[a-zA-Z0-9_-]{5,256}$
            minLength: 5
            maxLength: 256
      responses:
        '200':
          description: 'Подтверждение приёма: платформа ожидает 200 OK без тела'
      tags:
        - webhook-server
      requestBody:
        required: true
        content:
          application/json:
            schema:
              # композит [E] две равноправные формы тела на выбор разработчика бота; аналога в оригинале нет — вебхук MAX не публикует
              anyOf:
                - $ref: '#/components/schemas/UpdateUnified'
                - $ref: '#/components/schemas/WebhookUpdate'
        description: Событие; какие поля заполнены — определяется значением update_type
components:
  schemas:
    MaxBotApi.Attachment:
      # композит [A] полиморфное поле: тот же discriminator, что в оригинале MAX; без oneOf проверялись бы только свойства базы
      oneOf:
        - $ref: '#/components/schemas/MaxBotApi.PhotoAttachment'
        - $ref: '#/components/schemas/MaxBotApi.VideoAttachment'
        - $ref: '#/components/schemas/MaxBotApi.AudioAttachment'
        - $ref: '#/components/schemas/MaxBotApi.FileAttachment'
        - $ref: '#/components/schemas/MaxBotApi.StickerAttachment'
        - $ref: '#/components/schemas/MaxBotApi.ContactAttachment'
        - $ref: '#/components/schemas/MaxBotApi.InlineKeyboardAttachment'
        - $ref: '#/components/schemas/MaxBotApi.ShareAttachment'
        - $ref: '#/components/schemas/MaxBotApi.LocationAttachment'
        - $ref: '#/components/schemas/MaxBotApi.DataAttachment'
        - $ref: '#/components/schemas/MaxBotApi.ReplyKeyboardAttachment'
      discriminator:
        propertyName: type
        mapping:
          image: '#/components/schemas/MaxBotApi.PhotoAttachment'
          video: '#/components/schemas/MaxBotApi.VideoAttachment'
          audio: '#/components/schemas/MaxBotApi.AudioAttachment'
          file: '#/components/schemas/MaxBotApi.FileAttachment'
          sticker: '#/components/schemas/MaxBotApi.StickerAttachment'
          contact: '#/components/schemas/MaxBotApi.ContactAttachment'
          inline_keyboard: '#/components/schemas/MaxBotApi.InlineKeyboardAttachment'
          share: '#/components/schemas/MaxBotApi.ShareAttachment'
          location: '#/components/schemas/MaxBotApi.LocationAttachment'
          data: '#/components/schemas/MaxBotApi.DataAttachment'
          reply_keyboard: '#/components/schemas/MaxBotApi.ReplyKeyboardAttachment'
      description: Общая схема, представляющая вложение сообщения
    MaxBotApi.AttachmentPayload:
      type: object
      required:
        - url
      properties:
        url:
          type: string
          maxLength: 2048
          pattern: ^[\w\W]{0,2048}$
          description: |-
            URL медиа-вложения. Этот URL будет получен в объекте Update после
            отправки сообщения в чат.

            Прямую ссылку на видео также можно получить с помощью метода
            `GET /videos/{-videoToken-}`. 2048 — официальный лимит URL в оригинальной
            схеме (LinkButton.url, LinkMarkup.url)
      description: Базовая полезная нагрузка медиа-вложения
    MaxBotApi.AudioAttachment:
      type: object
      required:
        - type
        - payload
      properties:
        type:
          type: string
          enum:
            - audio
          description: 'Тип вложения: `audio`'
        payload:
          # композит [B] обёртка одиночного $ref, как в оригинале MAX: в OpenAPI 3.0 соседи $ref игнорируются, описание бы потерялось
          allOf:
            - $ref: '#/components/schemas/MaxBotApi.MediaAttachmentPayload'
          description: Полезная нагрузка аудио-вложения
        transcription:
          type: string
          nullable: true
          maxLength: 255
          pattern: ^[\w\W]{0,255}$
          description: |-
            Аудио транскрипция. 255 — в оригинале лимита нет; временный лимит, пока
            транскрипции не используются
      additionalProperties: false
      description: Вложение аудио
    MaxBotApi.BotAddedToChatUpdate:
      type: object
      required:
        - update_type
        - chat_id
        - user
        - is_channel
        - timestamp
      properties:
        update_type:
          type: string
          enum:
            - bot_added
          description: 'Тип события: `bot_added`'
        chat_id:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
          description: ID чата, куда был добавлен бот. Как получить ID — в разделе «Получение chat_id»
        user:
          # композит [B] обёртка одиночного $ref, как в оригинале MAX: в OpenAPI 3.0 соседи $ref игнорируются, описание бы потерялось
          allOf:
            - $ref: '#/components/schemas/MaxBotApi.User'
          description: Пользователь, добавивший бота в чат
        is_channel:
          type: boolean
          description: Указывает, что бот добавлен в канал, а не в чат
        timestamp:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
          description: Unix-время, когда произошло событие
      additionalProperties: false
      description: Вы получите это событие, как только бот будет добавлен в чат или канал
    MaxBotApi.BotRemovedFromChatUpdate:
      type: object
      required:
        - update_type
        - chat_id
        - user
        - is_channel
        - timestamp
      properties:
        update_type:
          type: string
          enum:
            - bot_removed
          description: 'Тип события: `bot_removed`'
        chat_id:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
          description: ID чата, откуда был удалён бот. Как получить ID — в разделе «Получение chat_id»
        user:
          # композит [B] обёртка одиночного $ref, как в оригинале MAX: в OpenAPI 3.0 соседи $ref игнорируются, описание бы потерялось
          allOf:
            - $ref: '#/components/schemas/MaxBotApi.User'
          description: Пользователь, удаливший бота из чата
        is_channel:
          type: boolean
          description: Указывает, что бот удалён из канала, а не из чата
        timestamp:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
          description: Unix-время, когда произошло событие
      additionalProperties: false
      description: Вы получите это событие, как только бот будет удалён из чата
    MaxBotApi.BotStartedUpdate:
      type: object
      required:
        - update_type
        - chat_id
        - user
        - timestamp
      properties:
        update_type:
          type: string
          enum:
            - bot_started
          description: 'Тип события: `bot_started`'
        chat_id:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
          description: ID диалога, где произошло событие. Как получить ID — в разделе «Получение chat_id»
        user:
          # композит [B] обёртка одиночного $ref, как в оригинале MAX: в OpenAPI 3.0 соседи $ref игнорируются, описание бы потерялось
          allOf:
            - $ref: '#/components/schemas/MaxBotApi.User'
          description: Пользователь, который нажал кнопку `Start`
        payload:
          type: string
          nullable: true
          maxLength: 512
          pattern: ^[\w\W]{0,512}$
          description: Дополнительные данные из диплинков, переданные при запуске бота. 512 — значение из официальной схемы MAX
        user_locale:
          type: string
          maxLength: 255
          pattern: ^[\w\W]{0,255}$
          description: Текущий язык пользователя в формате IETF BCP 47
        timestamp:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
          description: Unix-время, когда произошло событие
      additionalProperties: false
      description: |-
        Вы получите это событие, как только пользователь начнёт или возобновит
        общение с ботом: нажмёт соответствующую кнопку в настройках бота в МАКС
    MaxBotApi.BotStoppedUpdate:
      type: object
      required:
        - update_type
        - chat_id
        - user
        - timestamp
      properties:
        update_type:
          type: string
          enum:
            - bot_stopped
          description: 'Тип события: `bot_stopped`'
        chat_id:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
          description: ID диалога, где произошло событие. Как получить ID — в разделе «Получение chat_id»
        user:
          # композит [B] обёртка одиночного $ref, как в оригинале MAX: в OpenAPI 3.0 соседи $ref игнорируются, описание бы потерялось
          allOf:
            - $ref: '#/components/schemas/MaxBotApi.User'
          description: Пользователь, который остановил бота
        user_locale:
          type: string
          maxLength: 255
          pattern: ^[\w\W]{0,255}$
          description: Текущий язык пользователя в формате IETF BCP 47
        timestamp:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
          description: Unix-время, когда произошло событие
      additionalProperties: false
      description: Вы получите это событие, как только пользователь остановит бота в его настройках в МАКС
    MaxBotApi.Button:
      # композит [A] полиморфное поле: тот же discriminator, что в оригинале MAX; без oneOf проверялись бы только свойства базы
      oneOf:
        - $ref: '#/components/schemas/MaxBotApi.CallbackButton'
        - $ref: '#/components/schemas/MaxBotApi.LinkButton'
        - $ref: '#/components/schemas/MaxBotApi.RequestGeoLocationButton'
        - $ref: '#/components/schemas/MaxBotApi.RequestContactButton'
        - $ref: '#/components/schemas/MaxBotApi.ChatButton'
        - $ref: '#/components/schemas/MaxBotApi.OpenAppButton'
        - $ref: '#/components/schemas/MaxBotApi.ClipboardButton'
        - $ref: '#/components/schemas/MaxBotApi.MessageButton'
      discriminator:
        propertyName: type
        mapping:
          callback: '#/components/schemas/MaxBotApi.CallbackButton'
          link: '#/components/schemas/MaxBotApi.LinkButton'
          request_geo_location: '#/components/schemas/MaxBotApi.RequestGeoLocationButton'
          request_contact: '#/components/schemas/MaxBotApi.RequestContactButton'
          chat: '#/components/schemas/MaxBotApi.ChatButton'
          open_app: '#/components/schemas/MaxBotApi.OpenAppButton'
          clipboard: '#/components/schemas/MaxBotApi.ClipboardButton'
          message: '#/components/schemas/MaxBotApi.MessageButton'
      description: Кнопка клавиатуры
    MaxBotApi.ButtonRow:
      type: array
      items:
        $ref: '#/components/schemas/MaxBotApi.Button'
      maxItems: 100
      description: Ряд кнопок клавиатуры
    MaxBotApi.Callback:
      type: object
      required:
        - timestamp
        - callback_id
        - user
      properties:
        timestamp:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
          description: Unix-время, когда пользователь нажал кнопку
        callback_id:
          type: string
          maxLength: 1024
          pattern: ^[\w\W]{0,1024}$
          description: Текущий ID клавиатуры. 1024 — в оригинале лимита нет; по аналогии с официальным лимитом кнопочного payload (CallbackButton.payload)
        payload:
          type: string
          maxLength: 1024
          pattern: ^[\w\W]{0,1024}$
          description: 'Токен кнопки. 1024 — официальный лимит источника значения: токен приходит из CallbackButton.payload (maxLength 1024 в оригинале)'
        user:
          # композит [B] обёртка одиночного $ref, как в оригинале MAX: в OpenAPI 3.0 соседи $ref игнорируются, описание бы потерялось
          allOf:
            - $ref: '#/components/schemas/MaxBotApi.User'
          description: Пользователь, нажавший на кнопку
      additionalProperties: false
      description: Объект, отправленный боту, когда пользователь нажимает кнопку
    MaxBotApi.CallbackButton:
      type: object
      required:
        - type
        - payload
        - text
      properties:
        type:
          type: string
          enum:
            - callback
          description: 'Тип кнопки: `callback`'
        payload:
          type: string
          maxLength: 1024
          pattern: ^[\w\W]{0,1024}$
          description: Токен кнопки. 1024 — значение из официальной схемы MAX
        text:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[\w\W]{1,128}$
          description: 'Видимый текст кнопки. Чтобы он отображался полностью, рекомендуем не превышать заданное количество символов в зависимости от размещения текста: `20` символов — при 1 кнопке в ряду, `10` — при 2, `5` — при 3, `3` — при 4. 128 — значение из официальной схемы MAX'
      additionalProperties: false
      description: После нажатия на такую кнопку клиент отправляет на сервер полезную нагрузку
    MaxBotApi.Chat:
      type: object
      required:
        - chat_id
        - type
        - status
        - title
        - icon
        - last_event_time
        - participants_count
        - is_public
        - description
      properties:
        chat_id:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
          description: ID чата или канала — в зависимости от ограничений метода и от того, с чем вы работаете. Как получить ID — в разделе «Получение chat_id»
        type:
          # композит [B] обёртка одиночного $ref, как в оригинале MAX: в OpenAPI 3.0 соседи $ref игнорируются, описание бы потерялось
          allOf:
            - $ref: '#/components/schemas/MaxBotApi.ChatType'
          description: 'Тип чата: `"chat"` — Групповой чат, `"channel"` — Канал, `"dialog"` — Диалог'
        status:
          # композит [B] обёртка одиночного $ref, как в оригинале MAX: в OpenAPI 3.0 соседи $ref игнорируются, описание бы потерялось
          allOf:
            - $ref: '#/components/schemas/MaxBotApi.ChatStatus'
          description: 'Статус чата: `"active"` — Бот является активным участником чата, `"removed"` — Бот был удалён из чата, `"left"` — Бот покинул чат, `"closed"` — Чат был закрыт'
        title:
          type: string
          nullable: true
          maxLength: 200
          pattern: ^[\w\W]{0,200}$
          description: Отображаемое название чата или канала. Может быть `null` для диалогов. 200 — официальный лимит названия чата (ChatButton.chat_title, ChatPatch.title)
        icon:
          type: object
          # композит [C] обёртка одиночного $ref, как в оригинале MAX: иначе nullable рядом с $ref игнорируется и поле не примет null
          allOf:
            - $ref: '#/components/schemas/MaxBotApi.Image'
          nullable: true
          description: Иконка чата или канала
        last_event_time:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
          description: Время последнего события в чате или канале
        participants_count:
          type: integer
          format: int32
          minimum: 0
          maximum: 2147483647
          description: Количество участников чата или канала. Для диалогов всегда `2`
        owner_id:
          type: integer
          format: int64
          nullable: true
          minimum: 0
          maximum: 9007199254740991
          description: ID владельца чата или канала
        participants:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/MaxBotApi.SafeInt64'
          nullable: true
          description: Участники чата или канала с временем последней активности. Может быть `null`, если запрашивается список чатов
        is_public:
          type: boolean
          description: Доступен ли чат публично (для диалогов всегда `false`)
        link:
          type: string
          nullable: true
          maxLength: 2048
          pattern: ^[\w\W]{0,2048}$
          description: Ссылка на чат. 2048 — официальный лимит URL в оригинальной схеме (LinkButton.url, LinkMarkup.url)
        description:
          type: string
          nullable: true
          maxLength: 400
          pattern: ^[\w\W]{0,400}$
          description: Описание чата или канала. 400 — официальный лимит описания чата (ChatButton.chat_description)
        dialog_with_user:
          type: object
          # композит [C] обёртка одиночного $ref, как в оригинале MAX: иначе nullable рядом с $ref игнорируется и поле не примет null
          allOf:
            - $ref: '#/components/schemas/MaxBotApi.UserWithPhoto'
          nullable: true
          description: Данные о пользователе в диалоге (только для чатов типа `"dialog"`)
        messages_count:
          type: integer
          nullable: true
          minimum: 0
          maximum: 2147483647
          description: Количество сообщений в групповых чатах и каналах
        pinned_message:
          type: object
          # композит [C] обёртка одиночного $ref, как в оригинале MAX: иначе nullable рядом с $ref игнорируется и поле не примет null
          allOf:
            - $ref: '#/components/schemas/MaxBotApi.Message'
          nullable: true
          description: Закреплённое сообщение в чате (возвращается только при запросе конкретного чата или канала)
      additionalProperties: false
      description: |-
        Объект содержит общую информацию о групповом чате или канале: его тип,
        настройки отображения (название, аватар, описание, ссылка), публичную
        доступность, а также информацию об участниках (владельце, боте и других
        пользователях), времени их последней активности и событиях
    MaxBotApi.ChatButton:
      type: object
      required:
        - type
        - chat_title
        - text
      properties:
        type:
          type: string
          enum:
            - chat
          description: 'Тип кнопки: `chat`'
        chat_title:
          type: string
          maxLength: 200
          pattern: ^[\w\W]{0,200}$
          description: Название чата, который будет создан. 200 — значение из официальной схемы MAX
        chat_description:
          type: string
          nullable: true
          maxLength: 400
          pattern: ^[\w\W]{0,400}$
          description: Описание чата. 400 — значение из официальной схемы MAX
        start_payload:
          type: string
          nullable: true
          maxLength: 512
          pattern: ^[\w\W]{0,512}$
          description: Стартовая полезная нагрузка будет отправлена боту, как только чат будет создан. 512 — значение из официальной схемы MAX
        uuid:
          type: integer
          nullable: true
          minimum: 0
          maximum: 2147483647
          description: |-
            Уникальный ID кнопки среди всех кнопок чата на клавиатуре.
            Если `uuid` изменён, новый чат будет создан при следующем нажатии.
            Сервер сгенерирует его в момент, когда кнопка будет впервые размещена.
            Используйте его при редактировании сообщения.
        text:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[\w\W]{1,128}$
          description: 'Видимый текст кнопки. Чтобы он отображался полностью, рекомендуем не превышать заданное количество символов в зависимости от размещения текста: `20` символов — при 1 кнопке в ряду, `10` — при 2, `5` — при 3, `3` — при 4. 128 — значение из официальной схемы MAX'
      additionalProperties: false
      description: |-
        Кнопка, которая создает новый чат, как только первый пользователь на нее нажмёт.
        Бот будет добавлен в участники чата как администратор.
        Автор сообщения станет владельцем чата.

        В оригинальной схеме отсутствует в `Button.discriminator.mapping` — см.
        DEVIATIONS `mapping[chat]` в scripts/compare.py: литерал "chat" выведен по
        конвенции соседних ключей (тот же приём, что и для `DataAttachment`).
