    MaxBotApi.Update:
      # композит [A] полиморфное поле: тот же discriminator, что в оригинале MAX; без oneOf проверялись бы только свойства базы
      oneOf:
        - $ref: '#/components/schemas/MaxBotApi.MessageCallbackUpdate'
        - $ref: '#/components/schemas/MaxBotApi.MessageEditedUpdate'
        - $ref: '#/components/schemas/MaxBotApi.MessageRemovedUpdate'
        - $ref: '#/components/schemas/MaxBotApi.BotAddedToChatUpdate'
        - $ref: '#/components/schemas/MaxBotApi.BotRemovedFromChatUpdate'
        - $ref: '#/components/schemas/MaxBotApi.BotStartedUpdate'
        - $ref: '#/components/schemas/MaxBotApi.BotStoppedUpdate'
        - $ref: '#/components/schemas/MaxBotApi.ChatTitleChangedUpdate'
        - $ref: '#/components/schemas/MaxBotApi.DialogClearedUpdate'
        - $ref: '#/components/schemas/MaxBotApi.DialogMutedUpdate'
        - $ref: '#/components/schemas/MaxBotApi.DialogUnmutedUpdate'
        - $ref: '#/components/schemas/MaxBotApi.DialogRemovedUpdate'
        - $ref: '#/components/schemas/MaxBotApi.UserAddedToChatUpdate'
        - $ref: '#/components/schemas/MaxBotApi.UserRemovedFromChatUpdate'
        - $ref: '#/components/schemas/MaxBotApi.MessageChatCreatedUpdate'
        - $ref: '#/components/schemas/MaxBotApi.MessageCreatedUpdate'
      discriminator:
        propertyName: update_type
        mapping:
          message_callback: '#/components/schemas/MaxBotApi.MessageCallbackUpdate'
          message_edited: '#/components/schemas/MaxBotApi.MessageEditedUpdate'
          message_removed: '#/components/schemas/MaxBotApi.MessageRemovedUpdate'
          bot_added: '#/components/schemas/MaxBotApi.BotAddedToChatUpdate'
          bot_removed: '#/components/schemas/MaxBotApi.BotRemovedFromChatUpdate'
          bot_started: '#/components/schemas/MaxBotApi.BotStartedUpdate'
          bot_stopped: '#/components/schemas/MaxBotApi.BotStoppedUpdate'
          chat_title_changed: '#/components/schemas/MaxBotApi.ChatTitleChangedUpdate'
          dialog_cleared: '#/components/schemas/MaxBotApi.DialogClearedUpdate'
          dialog_muted: '#/components/schemas/MaxBotApi.DialogMutedUpdate'
          dialog_unmuted: '#/components/schemas/MaxBotApi.DialogUnmutedUpdate'
          dialog_removed: '#/components/schemas/MaxBotApi.DialogRemovedUpdate'
          user_added: '#/components/schemas/MaxBotApi.UserAddedToChatUpdate'
          user_removed: '#/components/schemas/MaxBotApi.UserRemovedFromChatUpdate'
          message_chat_created: '#/components/schemas/MaxBotApi.MessageChatCreatedUpdate'
          message_created: '#/components/schemas/MaxBotApi.MessageCreatedUpdate'
      description: |-
        Объект `Update` описывает возможные события в чате или канале. Может
        возвращаться в следующих случаях:
        - вы подписались на обновления через Webhook — при наступлении события
        МАКС пришлёт POST-запрос `/subscriptions`, который содержит объект `Update`;
        - вы отправили GET-запрос `/updates` для получения обновлений через
        Long Polling — в ответ вернётся объект `Update`.
    MaxBotApi.User:
      type: object
      required:
        - user_id
        - first_name
        - is_bot
        - last_activity_time
        - name
      properties:
        user_id:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
          description: Идентификатор пользователя или бота
        first_name:
          type: string
          maxLength: 255
          pattern: ^[\w\W]{0,255}$
          description: Отображаемое имя пользователя или бота
        last_name:
          type: string
          nullable: true
          maxLength: 255
          pattern: ^[\w\W]{0,255}$
          description: Отображаемая фамилия пользователя. Для ботов это поле не возвращается
        username:
          type: string
          nullable: true
          maxLength: 255
          pattern: ^[\w\W]{0,255}$
          description: Никнейм бота или уникальное публичное имя пользователя. В случае с пользователем может быть `null`, если тот недоступен или имя не задано
        is_bot:
          type: boolean
          description: '`true`, если это бот'
        last_activity_time:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
          description: Время последней активности пользователя или бота в MAX (Unix-время в миллисекундах). Если пользователь отключил в настройках профиля мессенджера MAX возможность видеть, что он в сети онлайн, поле может не возвращаться
        name:
          type: string
          nullable: true
          maxLength: 255
          pattern: ^[\w\W]{0,255}$
          description: Устаревшее поле, скоро будет удалено
      description: |-
        Объект, описывающий один из вариантов наследования:

        - `User` — объект содержит общую информацию о пользователе или боте без аватара
        - `UserWithPhoto` — объект с общей информацией о пользователе или боте, дополнительно содержит URL аватара и описание
        - `BotInfo` — объект включает общую информацию о боте, URL аватара и описание. Дополнительно содержит список команд, поддерживаемых ботом. Возвращается только при вызове метода `GET /me`
        - `ChatMember` — объект включает общую информацию о пользователе или боте, URL аватара и описание при его наличии. Дополнительно содержит данные для пользователей-участников чата. Возвращается только при вызове некоторых методов группы `/chats`
    MaxBotApi.UserAddedToChatUpdate:
      type: object
      required:
        - update_type
        - chat_id
        - user
        - is_channel
        - timestamp
      properties:
        update_type:
          type: string
          enum:
            - user_added
          description: 'Тип события: `user_added`'
        chat_id:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
          description: ID чата, где произошло событие. Как получить ID — в разделе «Получение chat_id»
        user:
          # композит [B] обёртка одиночного $ref, как в оригинале MAX: в OpenAPI 3.0 соседи $ref игнорируются, описание бы потерялось
          allOf:
            - $ref: '#/components/schemas/MaxBotApi.User'
          description: Пользователь, добавленный в чат
        inviter_id:
          type: integer
          format: int64
          nullable: true
          minimum: 0
          maximum: 9007199254740991
          description: |-
            Пользователь, который добавил нового пользователя в чат. Может быть
            `null`, если пользователь присоединился к чату по ссылке
        is_channel:
          type: boolean
          description: Указывает, что пользователь добавлен в канал, а не в чат
        timestamp:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
          description: Unix-время, когда произошло событие
      additionalProperties: false
      description: |-
        Вы получите это событие, как только пользователь будет добавлен в чат,
        где бот является администратором
    MaxBotApi.UserMentionMarkup:
      type: object
      required:
        - type
        - from
        - length
      properties:
        type:
          type: string
          enum:
            - user_mention
          description: 'Тип элемента разметки: `user_mention`'
        user_link:
          type: string
          nullable: true
          maxLength: 255
          pattern: ^[\w\W]{0,255}$
          description: '`@username` упомянутого пользователя'
        user_id:
          type: integer
          format: int64
          nullable: true
          minimum: 0
          maximum: 9007199254740991
          description: ID упомянутого пользователя без имени
        from:
          type: integer
          format: int32
          minimum: 0
          maximum: 2147483647
          description: Индекс начала элемента разметки в тексте. Нумерация с нуля
        length:
          type: integer
          format: int32
          minimum: 0
          maximum: 2147483647
          description: Длина элемента разметки
      additionalProperties: false
      description: Представляет упоминание пользователя в тексте. Упоминание может быть как по имени пользователя, так и по ID, если у пользователя нет имени
    MaxBotApi.UserRemovedFromChatUpdate:
      type: object
      required:
        - update_type
        - chat_id
        - user
        - is_channel
        - timestamp
      properties:
        update_type:
          type: string
          enum:
            - user_removed
          description: 'Тип события: `user_removed`'
        chat_id:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
          description: ID чата, где произошло событие. Как получить ID — в разделе «Получение chat_id»
        user:
          # композит [B] обёртка одиночного $ref, как в оригинале MAX: в OpenAPI 3.0 соседи $ref игнорируются, описание бы потерялось
          allOf:
            - $ref: '#/components/schemas/MaxBotApi.User'
          description: Пользователь, удалённый из чата
        admin_id:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
          description: |-
            Администратор, который удалил пользователя из чата. Может быть `null`,
            если пользователь покинул чат сам
        is_channel:
          type: boolean
          description: Указывает, что пользователь удалён из канала, а не из чата
        timestamp:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
          description: Unix-время, когда произошло событие
      additionalProperties: false
      description: |-
        Вы получите это событие, как только пользователь будет удалён из чата,
        где бот является администратором
    MaxBotApi.UserWithPhoto:
      type: object
      properties:
        description:
          type: string
          nullable: true
          maxLength: 16000
          pattern: ^[\w\W]{0,16000}$
          description: Описание пользователя или бота. В случае с пользователем может принимать значение `null`, если описание не заполнено. 16000 — значение из официальной схемы MAX
        avatar_url:
          type: string
          maxLength: 2048
          pattern: ^[\w\W]{0,2048}$
          description: URL аватара пользователя или бота в уменьшенном размере. 2048 — официальный лимит URL в оригинальной схеме (LinkButton.url, LinkMarkup.url)
        full_avatar_url:
          type: string
          maxLength: 2048
          pattern: ^[\w\W]{0,2048}$
          description: URL аватара пользователя или бота в полном размере. 2048 — официальный лимит URL в оригинальной схеме (LinkButton.url, LinkMarkup.url)
      # композит [D] наследование от MaxBotApi.User
      allOf:
        - $ref: '#/components/schemas/MaxBotApi.User'
      description: Объект с общей информацией о пользователе или боте. Является наследником схемы User — дополнительно к ней содержит URL аватара и описание
    MaxBotApi.VideoAttachment:
      type: object
      required:
        - type
        - payload
      properties:
        type:
          type: string
          enum:
            - video
          description: 'Тип вложения: `video`'
        payload:
          # композит [B] обёртка одиночного $ref, как в оригинале MAX: в OpenAPI 3.0 соседи $ref игнорируются, описание бы потерялось
          allOf:
            - $ref: '#/components/schemas/MaxBotApi.MediaAttachmentPayload'
          description: Полезная нагрузка видео-вложения
        thumbnail:
          type: object
          # композит [C] обёртка одиночного $ref, как в оригинале MAX: иначе nullable рядом с $ref игнорируется и поле не примет null
          allOf:
            - $ref: '#/components/schemas/MaxBotApi.VideoThumbnail'
          nullable: true
          description: Миниатюра видео
        width:
          type: integer
          nullable: true
          minimum: 0
          maximum: 2147483647
          description: Ширина видео
        height:
          type: integer
          nullable: true
          minimum: 0
          maximum: 2147483647
          description: Высота видео
        duration:
          type: integer
          nullable: true
          minimum: 0
          maximum: 2147483647
          description: Длина видео в секундах
      additionalProperties: false
      description: Вложение видео
    MaxBotApi.VideoThumbnail:
      type: object
      required:
        - url
      properties:
        url:
          type: string
          maxLength: 2048
          pattern: ^[\w\W]{0,2048}$
          description: URL изображения. 2048 — официальный лимит URL в оригинальной схеме (LinkButton.url, LinkMarkup.url)
      additionalProperties: false
      description: Миниатюра видео
    UpdateUnified:
      type: object
      required:
        - update_type
        - timestamp
      properties:
        update_type:
          type: string
          maxLength: 64
          pattern: ^[a-z_]+$
          description: |-
            Тип события: message_created | message_callback | message_edited |
            message_removed | message_chat_created | bot_added | bot_removed |
            bot_started | bot_stopped | chat_title_changed | dialog_cleared |
            dialog_muted | dialog_unmuted | dialog_removed | user_added |
            user_removed
        timestamp:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
          description: Unix-время, когда произошло событие
        chat_id:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
          description: ID чата. [bot_added, bot_started, bot_stopped, bot_removed, chat_title_changed, dialog_cleared, dialog_muted, dialog_unmuted, dialog_removed, message_removed, user_added, user_removed]
        user:
          # композит [B] обёртка одиночного $ref, как в оригинале MAX: в OpenAPI 3.0 соседи $ref игнорируются, описание бы потерялось
          allOf:
            - $ref: '#/components/schemas/MaxBotApi.User'
          description: Пользователь-инициатор события. [bot_added, bot_started, bot_stopped, bot_removed, chat_title_changed, dialog_cleared, dialog_muted, dialog_unmuted, dialog_removed, user_added, user_removed]
        user_locale:
          type: string
          nullable: true
          maxLength: 255
          pattern: ^[\w\W]{0,255}$
          description: Текущий язык пользователя (IETF BCP 47), доступен только в диалогах. [bot_started, bot_stopped, dialog_cleared, dialog_muted, dialog_unmuted, dialog_removed, message_created, message_callback]
        is_channel:
          type: boolean
          description: Признак «событие в канале, а не в чате». [bot_added, bot_removed, user_added, user_removed]
        message:
          type: object
          # композит [C] обёртка одиночного $ref, как в оригинале MAX: иначе nullable рядом с $ref игнорируется и поле не примет null
          allOf:
            - $ref: '#/components/schemas/MaxBotApi.Message'
          nullable: true
          description: 'Сообщение: новое, отредактированное или с нажатой кнопкой (может быть null). [message_created, message_edited, message_callback]'
        callback:
          # композит [B] обёртка одиночного $ref, как в оригинале MAX: в OpenAPI 3.0 соседи $ref игнорируются, описание бы потерялось
          allOf:
            - $ref: '#/components/schemas/MaxBotApi.Callback'
          description: Нажатие callback-кнопки. [message_callback]
        title:
          type: string
          maxLength: 200
          pattern: ^[\w\W]{0,200}$
          description: Новое название чата. 200 — официальный лимит названия чата (ChatButton.chat_title, ChatPatch.title). [chat_title_changed]
        payload:
          type: string
          nullable: true
          maxLength: 512
          pattern: ^[\w\W]{0,512}$
          description: Данные из диплинка, переданные при запуске бота. 512 — значение из официальной схемы MAX (BotStartedUpdate.payload). [bot_started]
        muted_until:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
          description: До какого времени отключены уведомления (Unix-время). [dialog_muted]
        inviter_id:
          type: integer
          format: int64
          nullable: true
          minimum: 0
          maximum: 9007199254740991
          description: Кто пригласил пользователя; null, если вошёл по ссылке. [user_added]
        admin_id:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
          description: Администратор, удаливший пользователя; отсутствует, если пользователь вышел сам. [user_removed]
        message_id:
          type: string
          minLength: 1
          maxLength: 255
          pattern: ^[a-zA-Z0-9._\-]+$
          description: 'ID сообщения: удалённого или того, где была нажата кнопка чата. [message_removed, message_chat_created]'
        user_id:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
          description: Автор удалённого сообщения. [message_removed]
        chat:
          # композит [B] обёртка одиночного $ref, как в оригинале MAX: в OpenAPI 3.0 соседи $ref игнорируются, описание бы потерялось
          allOf:
            - $ref: '#/components/schemas/MaxBotApi.Chat'
          description: Созданный чат. [message_chat_created]
        start_payload:
          type: string
          nullable: true
          maxLength: 512
          pattern: ^[\w\W]{0,512}$
          description: Полезная нагрузка кнопки чата. 512 — официальный лимит источника значения (ChatButton.start_payload). [message_chat_created]
      additionalProperties: false
      description: |-
        Единая («плоская») схема события: объединение полей всех 16 типов
        `Update` в один объект — в стиле Telegram Bot API. Обязательны только
        `update_type` и `timestamp`; остальные поля приходят в зависимости от
        типа события. Удобна, когда на сервере хочется один класс/структуру
        на все события без union-машинерии.
    WebhookUpdate:
      # композит [A] полиморфное поле: тот же discriminator, что в оригинале MAX; без oneOf проверялись бы только свойства базы
      oneOf:
        - $ref: '#/components/schemas/MaxBotApi.MessageCreatedUpdate'
        - $ref: '#/components/schemas/MaxBotApi.MessageCallbackUpdate'
        - $ref: '#/components/schemas/MaxBotApi.MessageEditedUpdate'
        - $ref: '#/components/schemas/MaxBotApi.MessageRemovedUpdate'
        - $ref: '#/components/schemas/MaxBotApi.MessageChatCreatedUpdate'
        - $ref: '#/components/schemas/MaxBotApi.BotAddedToChatUpdate'
        - $ref: '#/components/schemas/MaxBotApi.BotRemovedFromChatUpdate'
        - $ref: '#/components/schemas/MaxBotApi.BotStartedUpdate'
        - $ref: '#/components/schemas/MaxBotApi.BotStoppedUpdate'
        - $ref: '#/components/schemas/MaxBotApi.ChatTitleChangedUpdate'
        - $ref: '#/components/schemas/MaxBotApi.DialogClearedUpdate'
        - $ref: '#/components/schemas/MaxBotApi.DialogMutedUpdate'
        - $ref: '#/components/schemas/MaxBotApi.DialogUnmutedUpdate'
        - $ref: '#/components/schemas/MaxBotApi.DialogRemovedUpdate'
        - $ref: '#/components/schemas/MaxBotApi.UserAddedToChatUpdate'
        - $ref: '#/components/schemas/MaxBotApi.UserRemovedFromChatUpdate'
      discriminator:
        propertyName: update_type
        mapping:
          message_created: '#/components/schemas/MaxBotApi.MessageCreatedUpdate'
          message_callback: '#/components/schemas/MaxBotApi.MessageCallbackUpdate'
          message_edited: '#/components/schemas/MaxBotApi.MessageEditedUpdate'
          message_removed: '#/components/schemas/MaxBotApi.MessageRemovedUpdate'
          message_chat_created: '#/components/schemas/MaxBotApi.MessageChatCreatedUpdate'
          bot_added: '#/components/schemas/MaxBotApi.BotAddedToChatUpdate'
          bot_removed: '#/components/schemas/MaxBotApi.BotRemovedFromChatUpdate'
          bot_started: '#/components/schemas/MaxBotApi.BotStartedUpdate'
          bot_stopped: '#/components/schemas/MaxBotApi.BotStoppedUpdate'
          chat_title_changed: '#/components/schemas/MaxBotApi.ChatTitleChangedUpdate'
          dialog_cleared: '#/components/schemas/MaxBotApi.DialogClearedUpdate'
          dialog_muted: '#/components/schemas/MaxBotApi.DialogMutedUpdate'
          dialog_unmuted: '#/components/schemas/MaxBotApi.DialogUnmutedUpdate'
          dialog_removed: '#/components/schemas/MaxBotApi.DialogRemovedUpdate'
          user_added: '#/components/schemas/MaxBotApi.UserAddedToChatUpdate'
          user_removed: '#/components/schemas/MaxBotApi.UserRemovedFromChatUpdate'
      description: |-
        Явный oneOf всех 16 типов событий — чтобы Swagger UI и генераторы
        показывали полный список вариантов, а не только базовые поля Update
        (allOf-наследование дискриминированного union'а UI не разворачивают).
servers:
  - url: https://bot.example.ru
    description: Ваш webhook-endpoint (URL из POST /subscriptions)
    variables: {}
