        - chat_id
        - user_id
        - timestamp
      properties:
        update_type:
          type: string
          enum:
            - message_removed
          description: 'Тип события: `message_removed`'
        message_id:
          # композит [B] обёртка одиночного $ref, как в оригинале MAX: в OpenAPI 3.0 соседи $ref игнорируются, описание бы потерялось
          allOf:
            - $ref: '#/components/schemas/MaxBotApi.MessageId'
          description: ID удалённого сообщения
        chat_id:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
          description: ID чата, где сообщение было удалено. Как получить ID — в разделе «Получение chat_id»
        user_id:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
          description: Пользователь, удаливший сообщение
        timestamp:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
          description: Unix-время, когда произошло событие
      additionalProperties: false
      description: Вы получите это событие, как только сообщение будет удалено
    MaxBotApi.MessageStat:
      type: object
      required:
        - views
      properties:
        views:
          type: integer
          minimum: 0
          maximum: 2147483647
          description: Количество пользователей, которые увидели пост в канале. Просмотр засчитывается, когда пост попадает в область видимости экрана
      additionalProperties: false
      description: Статистика сообщения. Возвращается только для постов в каналах
    MaxBotApi.MonospacedMarkup:
      type: object
      required:
        - type
        - from
        - length
      properties:
        type:
          type: string
          enum:
            - monospaced
          description: 'Тип элемента разметки: `monospaced`'
        from:
          type: integer
          format: int32
          minimum: 0
          maximum: 2147483647
          description: Индекс начала элемента разметки в тексте. Нумерация с нуля
        length:
          type: integer
          format: int32
          minimum: 0
          maximum: 2147483647
          description: Длина элемента разметки
      additionalProperties: false
      description: Представляет `моноширинный` или блок ```код``` в тексте
    MaxBotApi.OpenAppButton:
      type: object
      required:
        - type
        - text
      properties:
        type:
          type: string
          enum:
            - open_app
          description: 'Тип кнопки: `open_app`'
        web_app:
          type: string
          maxLength: 2048
          pattern: ^[\w\W]{0,2048}$
          description: Публичное имя (username) бота или ссылка на него, чьё мини-приложение надо запустить. 2048 — официальный лимит URL в оригинальной схеме (LinkButton.url, LinkMarkup.url)
        contact_id:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
          description: Идентификатор бота, чьё мини-приложение надо запустить
        payload:
          type: string
          maxLength: 1024
          pattern: ^[\w\W]{0,1024}$
          description: Параметр запуска, который будет передан в initData мини-приложения. 1024 — в оригинале лимита нет; по аналогии с официальным лимитом кнопочного payload (CallbackButton.payload)
        text:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[\w\W]{1,128}$
          description: 'Видимый текст кнопки. Чтобы он отображался полностью, рекомендуем не превышать заданное количество символов в зависимости от размещения текста: `20` символов — при 1 кнопке в ряду, `10` — при 2, `5` — при 3, `3` — при 4. 128 — значение из официальной схемы MAX'
