      description: После нажатия на такую кнопку пользователь переходит по ссылке, которую она содержит
    MaxBotApi.LinkMarkup:
      type: object
      required:
        - type
        - url
        - from
        - length
      properties:
        type:
          type: string
          enum:
            - link
          description: 'Тип элемента разметки: `link`'
        url:
          type: string
          minLength: 1
          maxLength: 2048
          pattern: ^[\w\W]{1,2048}$
          description: URL ссылки. 2048 — значение из официальной схемы MAX
        from:
          type: integer
          format: int32
          minimum: 0
          maximum: 2147483647
          description: Индекс начала элемента разметки в тексте. Нумерация с нуля
        length:
          type: integer
          format: int32
          minimum: 0
          maximum: 2147483647
          description: Длина элемента разметки
      additionalProperties: false
      description: Представляет ссылку в тексте
    MaxBotApi.LinkedMessage:
      type: object
      required:
        - type
        - message
      properties:
        type:
          # композит [B] обёртка одиночного $ref, как в оригинале MAX: в OpenAPI 3.0 соседи $ref игнорируются, описание бы потерялось
          allOf:
            - $ref: '#/components/schemas/MaxBotApi.MessageLinkType'
          description: Тип связанного сообщения
        sender:
          # композит [B] обёртка одиночного $ref, как в оригинале MAX: в OpenAPI 3.0 соседи $ref игнорируются, описание бы потерялось
          allOf:
            - $ref: '#/components/schemas/MaxBotApi.User'
          description: Пользователь, отправивший сообщение
        chat_id:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
          description: Чат, в котором сообщение было изначально опубликовано. Только для пересланных сообщений. Как получить ID — в разделе «Получение chat_id»
        message:
          # композит [B] обёртка одиночного $ref, как в оригинале MAX: в OpenAPI 3.0 соседи $ref игнорируются, описание бы потерялось
          allOf:
            - $ref: '#/components/schemas/MaxBotApi.MessageBody'
          description: Содержимое связанного (пересланного или ответного) сообщения
      additionalProperties: false
      description: Пересланное или ответное сообщение
    MaxBotApi.LocationAttachment:
      type: object
      required:
        - type
        - latitude
        - longitude
      properties:
        type:
          type: string
          enum:
            - location
          description: 'Тип вложения: `location`'
        latitude:
          type: number
          format: double
          minimum: -90
          maximum: 90
          description: Широта. Диапазон от -90 до 90 — требование КБ (числовой тип должен иметь minimum/maximum); в оригинальной схеме MAX границы не заданы
        longitude:
          type: number
          format: double
          minimum: -180
          maximum: 180
          description: Долгота. Диапазон от -180 до 180 — требование КБ (числовой тип должен иметь minimum/maximum); в оригинальной схеме MAX границы не заданы
      additionalProperties: false
      description: Вложение географического положения
    MaxBotApi.MarkupElement:
      # композит [A] полиморфное поле: тот же discriminator, что в оригинале MAX; без oneOf проверялись бы только свойства базы
      oneOf:
        - $ref: '#/components/schemas/MaxBotApi.StrongMarkup'
        - $ref: '#/components/schemas/MaxBotApi.EmphasizedMarkup'
        - $ref: '#/components/schemas/MaxBotApi.MonospacedMarkup'
        - $ref: '#/components/schemas/MaxBotApi.LinkMarkup'
        - $ref: '#/components/schemas/MaxBotApi.StrikethroughMarkup'
        - $ref: '#/components/schemas/MaxBotApi.UnderlineMarkup'
        - $ref: '#/components/schemas/MaxBotApi.UserMentionMarkup'
        - $ref: '#/components/schemas/MaxBotApi.HeadingMarkup'
        - $ref: '#/components/schemas/MaxBotApi.HighlightedMarkup'
        - $ref: '#/components/schemas/MaxBotApi.QuoteMarkup'
      discriminator:
        propertyName: type
        mapping:
          strong: '#/components/schemas/MaxBotApi.StrongMarkup'
          emphasized: '#/components/schemas/MaxBotApi.EmphasizedMarkup'
          monospaced: '#/components/schemas/MaxBotApi.MonospacedMarkup'
          link: '#/components/schemas/MaxBotApi.LinkMarkup'
          strikethrough: '#/components/schemas/MaxBotApi.StrikethroughMarkup'
          underline: '#/components/schemas/MaxBotApi.UnderlineMarkup'
          user_mention: '#/components/schemas/MaxBotApi.UserMentionMarkup'
          heading: '#/components/schemas/MaxBotApi.HeadingMarkup'
          highlighted: '#/components/schemas/MaxBotApi.HighlightedMarkup'
          quote: '#/components/schemas/MaxBotApi.QuoteMarkup'
      description: Элемент разметки текста сообщения
    MaxBotApi.MediaAttachmentPayload:
      type: object
      required:
        - token
      properties:
        token:
          type: string
          maxLength: 1024
          pattern: ^[\w\W]{0,1024}$
          description: Используйте `token`, если вы пытаетесь повторно использовать одно и то же вложение в другом сообщении. 1024 — в оригинале лимита нет; по аналогии с официальным лимитом кнопочного payload (CallbackButton.payload)
        url:
          type: string
          maxLength: 2048
          pattern: ^[\w\W]{0,2048}$
          description: 'URL медиа-вложения. Этот URL будет получен в объекте Update после

            отправки сообщения в чат.


            Прямую ссылку на видео также можно получить с помощью метода

            `GET /videos/{-videoToken-}`. 2048 — официальный лимит URL в оригинальной

            схеме (LinkButton.url, LinkMarkup.url)'
      additionalProperties: false
      # композит [D] наследование от MaxBotApi.AttachmentPayload
      allOf:
        - $ref: '#/components/schemas/MaxBotApi.AttachmentPayload'
      description: Полезная нагрузка медиа-вложения (видео/аудио)
    MaxBotApi.Message:
      type: object
      required:
        - recipient
        - timestamp
        - body
      properties:
        sender:
          # композит [B] обёртка одиночного $ref, как в оригинале MAX: в OpenAPI 3.0 соседи $ref игнорируются, описание бы потерялось
          allOf:
            - $ref: '#/components/schemas/MaxBotApi.User'
          description: Пользователь, отправивший сообщение
        recipient:
          # композит [B] обёртка одиночного $ref, как в оригинале MAX: в OpenAPI 3.0 соседи $ref игнорируются, описание бы потерялось
          allOf:
            - $ref: '#/components/schemas/MaxBotApi.Recipient'
          description: Получатель сообщения. Может быть пользователем или чатом
        timestamp:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
          description: Время создания сообщения в формате Unix-time
        link:
          type: object
          # композит [C] обёртка одиночного $ref, как в оригинале MAX: иначе nullable рядом с $ref игнорируется и поле не примет null
          allOf:
            - $ref: '#/components/schemas/MaxBotApi.LinkedMessage'
          nullable: true
          description: Пересланное или ответное сообщение
        body:
          # композит [B] обёртка одиночного $ref, как в оригинале MAX: в OpenAPI 3.0 соседи $ref игнорируются, описание бы потерялось
          allOf:
            - $ref: '#/components/schemas/MaxBotApi.MessageBody'
          description: Содержимое сообщения. Текст + вложения. Может быть `null`, если сообщение содержит только пересланное сообщение
        stat:
          type: object
          # композит [C] обёртка одиночного $ref, как в оригинале MAX: иначе nullable рядом с $ref игнорируется и поле не примет null
          allOf:
            - $ref: '#/components/schemas/MaxBotApi.MessageStat'
          nullable: true
          description: Статистика сообщения. Возвращается только для постов в каналах
        url:
          type: string
          nullable: true
          maxLength: 2048
          pattern: ^[\w\W]{0,2048}$
          description: Публичная ссылка на пост в канале. Отсутствует для диалогов и групповых чатов. 2048 — официальный лимит URL в оригинальной схеме (LinkButton.url, LinkMarkup.url)
      additionalProperties: false
      description: Сообщение в чате
    MaxBotApi.MessageBody:
      type: object
      required:
        - mid
        - seq
        - text
      properties:
        mid:
          # композит [B] обёртка одиночного $ref, как в оригинале MAX: в OpenAPI 3.0 соседи $ref игнорируются, описание бы потерялось
          allOf:
            - $ref: '#/components/schemas/MaxBotApi.MessageId'
          description: Уникальный ID сообщения
        seq:
          type: integer
          maximum: 9223372036854775807
          format: int64
          minimum: 0
          description: |-
            ID последовательности сообщения в чате.

            Единственное int64-поле схемы БЕЗ `@maxValue`: его верхняя граница — предел
            самого типа (2^63-1), а не «JSON-safe» 2^53-1, как у идентификаторов и
            времени. `seq` не счётчик, а упакованное значение — старшие биты хранят
            время создания в миллисекундах, младшие счётчик внутри миллисекунды, — и
            прод отдаёт величины порядка 1.17e17, на порядок выше 2^53-1 (наблюдение
            зафиксировано в maxmoc/internal/ids/ids.go: mid
            `mid.000000001a5b94f2019fdaa593db1d43` разбирается в chat_id 442209522 и
            seq 117052520019991875). Прежняя граница 2^53-1 отвергала любой честный
            ответ платформы.

            Записать 2^63-1 через `@maxValue` нельзя: компилятор TypeSpec держит
            числовые литералы в JS-числах, и всё выше 2^53-1 теряет точность — эмиттер
            молча выбрасывает такое ограничение. Явный `maximum` дописывает
            scripts/apply_int_bounds.py.
        text:
          type: string
          nullable: true
          maxLength: 4000
          pattern: ^[\w\W]{0,4000}$
          description: Новый текст сообщения. 4000 — официальный лимит текста сообщения (NewMessageBody.text)
        attachments:
          type: array
          items:
            $ref: '#/components/schemas/MaxBotApi.Attachment'
          nullable: true
          maxItems: 100
          description: Вложения сообщения. Могут быть одним из типов `Attachment`. Смотрите описание схемы
        markup:
          type: array
          items:
            $ref: '#/components/schemas/MaxBotApi.MarkupElement'
          nullable: true
          maxItems: 500
          description: Разметка текста сообщения. Для подробной информации загляните в раздел [Форматирование](/docs-api#Форматирование%20текста%20в%20сообщениях)
      additionalProperties: false
      description: Схема, представляющая тело сообщения
    MaxBotApi.MessageButton:
      type: object
      required:
        - type
        - text
      properties:
        type:
          type: string
          enum:
            - message
          description: 'Тип кнопки: `message`'
        text:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[\w\W]{1,128}$
          description: 'Видимый текст кнопки. Чтобы он отображался полностью, рекомендуем не превышать заданное количество символов в зависимости от размещения текста: `20` символов — при 1 кнопке в ряду, `10` — при 2, `5` — при 3, `3` — при 4. 128 — значение из официальной схемы MAX'
      additionalProperties: false
      description: Кнопка, при нажатии на которую от лица пользователя в чат отправляется указанный текст
    MaxBotApi.MessageCallbackUpdate:
      type: object
      required:
        - update_type
        - callback
        - message
        - timestamp
      properties:
        update_type:
          type: string
          enum:
            - message_callback
          description: 'Тип события: `message_callback`'
        callback:
          # композит [B] обёртка одиночного $ref, как в оригинале MAX: в OpenAPI 3.0 соседи $ref игнорируются, описание бы потерялось
          allOf:
            - $ref: '#/components/schemas/MaxBotApi.Callback'
          description: Нажатая пользователем кнопка
        message:
          type: object
          # композит [C] обёртка одиночного $ref, как в оригинале MAX: иначе nullable рядом с $ref игнорируется и поле не примет null
          allOf:
            - $ref: '#/components/schemas/MaxBotApi.Message'
          nullable: true
          description: |-
            Изначальное сообщение, содержащее встроенную клавиатуру. Может быть
            `null`, если оно было удалено к моменту, когда бот получил это событие
        user_locale:
          type: string
          nullable: true
          maxLength: 255
          pattern: ^[\w\W]{0,255}$
          description: Текущий язык пользователя в формате IETF BCP 47
        timestamp:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
          description: Unix-время, когда произошло событие
      additionalProperties: false
      description: Вы получите это событие, как только пользователь нажмёт кнопку
    MaxBotApi.MessageChatCreatedUpdate:
      type: object
      required:
        - update_type
        - chat
        - message_id
        - timestamp
      properties:
        update_type:
          type: string
          enum:
            - message_chat_created
          description: 'Тип события: `message_chat_created`'
        chat:
          # композит [B] обёртка одиночного $ref, как в оригинале MAX: в OpenAPI 3.0 соседи $ref игнорируются, описание бы потерялось
          allOf:
            - $ref: '#/components/schemas/MaxBotApi.Chat'
          description: Созданный чат
        message_id:
          # композит [B] обёртка одиночного $ref, как в оригинале MAX: в OpenAPI 3.0 соседи $ref игнорируются, описание бы потерялось
          allOf:
            - $ref: '#/components/schemas/MaxBotApi.MessageId'
          description: ID сообщения, где была нажата кнопка
        start_payload:
          type: string
          nullable: true
          maxLength: 512
          pattern: ^[\w\W]{0,512}$
          description: Полезная нагрузка от кнопки чата. 512 — официальный лимит источника значения (ChatButton.start_payload)
        timestamp:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
          description: Unix-время, когда произошло событие
      additionalProperties: false
      description: |-
        Вы получите это событие, как только пользователь нажмёт в сообщении на
        кнопку с типом `chat` и будет создан новый чат с ботом, связанный с этим
        сообщением с кнопкой.

        KNOWN: в оригинальной схеме этот дискриминатор отсутствует в
        `Update.discriminator.mapping` (недосмотр оригинала) — см. DEVIATIONS
        `message_chat_created` в scripts/compare.py.
    MaxBotApi.MessageCreatedUpdate:
      type: object
      required:
        - update_type
        - message
        - timestamp
      properties:
        update_type:
          type: string
          enum:
            - message_created
          description: 'Тип события: `message_created`'
        message:
          # композит [B] обёртка одиночного $ref, как в оригинале MAX: в OpenAPI 3.0 соседи $ref игнорируются, описание бы потерялось
          allOf:
            - $ref: '#/components/schemas/MaxBotApi.Message'
          description: Новое созданное сообщение
        user_locale:
          type: string
          nullable: true
          maxLength: 255
          pattern: ^[\w\W]{0,255}$
          description: Текущий язык пользователя в формате IETF BCP 47. Доступно только в диалогах
        timestamp:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
          description: Unix-время, когда произошло событие
      additionalProperties: false
      description: Вы получите это событие, как только сообщение будет создано
    MaxBotApi.MessageEditedUpdate:
      type: object
      required:
        - update_type
        - message
        - timestamp
      properties:
        update_type:
          type: string
          enum:
            - message_edited
          description: 'Тип события: `message_edited`'
        message:
          # композит [B] обёртка одиночного $ref, как в оригинале MAX: в OpenAPI 3.0 соседи $ref игнорируются, описание бы потерялось
          allOf:
            - $ref: '#/components/schemas/MaxBotApi.Message'
          description: Отредактированное сообщение
        timestamp:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
          description: Unix-время, когда произошло событие
      additionalProperties: false
      description: Вы получите это событие, как только пользователь отредактирует сообщение
    MaxBotApi.MessageId:
      type: string
      minLength: 1
      maxLength: 255
      pattern: ^[a-zA-Z0-9._\-]+$
      description: |-
        ID сообщения (`mid`). Реальные ID имеют вид `mid.000000001a5b94f2…` —
        содержат точку, поэтому класс символов расширен относительно паттерна
