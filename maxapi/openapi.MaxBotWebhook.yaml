      type: string
      enum:
        - active
        - removed
        - left
        - closed
      description: Статус чата для текущего бота
    MaxBotApi.ChatTitleChangedUpdate:
      type: object
      required:
        - update_type
        - chat_id
        - user
        - title
        - timestamp
      properties:
        update_type:
          type: string
          enum:
            - chat_title_changed
          description: 'Тип события: `chat_title_changed`'
        chat_id:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
          description: ID чата, где произошло событие. Как получить ID — в разделе «Получение chat_id»
        user:
          # композит [B] обёртка одиночного $ref, как в оригинале MAX: в OpenAPI 3.0 соседи $ref игнорируются, описание бы потерялось
          allOf:
            - $ref: '#/components/schemas/MaxBotApi.User'
          description: Пользователь, который изменил название
        title:
          type: string
          maxLength: 200
          pattern: ^[\w\W]{0,200}$
          description: Новое название. 200 — официальный лимит названия чата (ChatButton.chat_title, ChatPatch.title)
        timestamp:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
          description: Unix-время, когда произошло событие
      additionalProperties: false
      description: Вы получите это событие, как только будет изменено название чата
    MaxBotApi.ChatType:
      type: string
      maxLength: 64
      pattern: ^[a-z_]+$
      description: |-
        Тип чата.

        Известные значения: `dialog` — диалог «клиент ↔ бот», `chat` — групповой чат,
        `channel` — канал. Разбирать их — задача кода, а не схемы.

        ОТЛИЧИЕ ОТ ОРИГИНАЛА (осознанное, см. DEVIATIONS в scripts/compare.py):
        оригинал объявляет это перечислением, и перечисление уже подводило. В 0.0.32
        оно состояло из одного `chat`, хотя описание там же гласило «диалог, чат», а
        живая платформа отдаёт `dialog` в каждом сообщении диалога: снятый с прода
        регресс (см. maxbotdemo/README.md) отверг по этой причине все 15 событий.
        В 0.0.33 набор дополнили до `chat`/`channel`/`dialog`, но сам способ остался
        хрупким — любое следующее значение снова превратит корректный ответ MAX в
        ошибку валидации у всех потребителей контракта.

        Поэтому здесь строка с ограничениями по форме (требование КБ), а не
        закрытый список. Схема перестаёт ломаться на расширении словаря, известные
        значения задокументированы выше.
